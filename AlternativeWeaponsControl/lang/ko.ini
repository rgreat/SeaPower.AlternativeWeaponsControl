help.UI/ClickVolume = 탭 버튼과 스위치의 클릭 음량, 0..1 (0 = 소리 없음; 게임 자체 버튼은 소리가 없습니다).
help.FireControl/GunOneDirector = 사격을 시작하는 함포는 게임처럼 모든 디렉터가 아니라 디렉터 하나(이미 목표를 추적 중인 것 또는 가장 좋은 빈 것)에서 목표 채널을 사용합니다 - 그래서 다른 디렉터는 다른 함포와 같은 디렉터를 공유하는 미사일을 위해 비어 있게 됩니다(예: 애들레이드의 Mk92 + STIR, 스베르들로프의 Top Bow + Four Eyes).
help.FireControl/GunChannelLimit = 디렉터에 목표용 빈 채널이 없는 함포는 채널이 비워질 때까지 로컬 통제로 조준합니다(작동하는 디렉터가 없을 때의 게임 페널티: 해결 이득 감소, 어둠에서 더 큰 오차). 꺼짐 = 게임과 동일: 해당 디렉터가 이미 몇 개의 목표를 추적하든 가장 좋은 작동 디렉터로 조준합니다.
help.UI/SamReadyButton = 발사 전 예열이 필요한 발사대(SAM)의 행에 준비 버튼: 클릭 = 지금 미사일 장전, 다시 클릭 = 격납.
help.UI/SamReadyMinutes = 버튼을 누른 뒤 사용하지 않을 때 발사대가 준비 상태를 유지하는 시간(분): 이후 미사일을 격납합니다.
help.Ships/SamAutoCharge = 유닛(적 포함)은 미확인 항공기가 아래 거리보다 가까워지면 SAM 발사대를 장전합니다(미사일을 레일에). 승조원이 이미 처리한 접촉(게임의 OODA 루프)만 해당합니다. 꺼짐 = 적 목표가 알려지면 시작되는 게임 자체의 예열.
help.Ships/SamKeepLoaded = 장전된(뜨거운) 발사대는 발사 후에도 미사일을 레일에 유지합니다: 게임은 발사대가 한동안 유휴 상태이면 탄약고로 내립니다(첫 발사 후 두 번째 미사일이 「사라짐」). 꺼짐 = 게임과 동일.
help.Ships/SamAnimFix = 탄약 파일에 발사대의 정확한 시스템 이름으로 된 위치 데이터가 없어도 미사일이 장전 및 격납 시 움직입니다(갑판 아래에서 올라오고 / 아래로 내려감)(예: SA-N-1 탄약을 쓰는 SA-N-1A): 가장 가까운 일치 항목을 사용합니다.
help.Ships/SamAutoChargeRange = 접근하는 미확인 항공기가 SAM 발사대 장전을 일으키는 거리(해리).
help.Ships/NoRbuSurfaceChase = 대잠 박격포(RBU)로 수상 목표를 공격하는 함정은 박격포 사거리에 들어가기 위해 추격하지 않습니다 - 침로를 유지하고 목표가 사거리에 들어오면 사격합니다. 모든 함정(적 포함).
help.Ships/NoAirChase = 함정은 항공기와 미사일을 무기 사거리에 넣기 위해 추격하지 않습니다 - 침로를 유지하고 사거리에 들어오면 사격합니다. 모든 함정(적 포함).
help.UI/WeaponsTabGroundUnits = 지상 차량과 육상 시설(자체 함포 / 발사대가 있는 유닛)용 무장 탭.
help.UI/WeaponsTabAircraft = 항공기와 헬리콥터용 무장 탭(하드포인트의 무기: 한 그룹, 탄약 종류별 사격, 목표 종류별 스위치).
help.UI/FireShowsZones = 사격 후 목표를 고르는 동안 무기의 사격 범위와 사거리가 지도와 3D에 표시됩니다(유닛 상태 줄에서 무기 위에 Alt를 누를 때 게임이 하는 것과 같음).
help.Optics/BinocularsNormalView = 최대 배율의 쌍안경이 일반 화면으로 시작합니다(게임은 야간 / 열 필터를 켠 채 시작). 게임의 필터 키로 필터를 켭니다.
help.Optics/NormalViewDayOnly = 일반 화면은 낮에만 기본값이며, 밤에는 게임 자체의 기본 필터가 유지됩니다.
help.Effects/FireFlicker = 함정의 화재 불빛이 깜박이며, 화재가 강할수록 더 깊고 빠릅니다(작음 / 보통 / 심각).
help.Effects/FireLightPower = 함정의 화재 불빛 밝기(게임 자체의 화재 불빛에 배율 적용; 범위도 커짐). 1 = 게임과 동일.
help.Effects/MuzzleFlashLight = 함포, CIWS, 기관총 발사 시 총구의 짧은 섬광(밤에 보임).
help.Effects/MissileLaunchFlashLight = 발사 후 부스터가 타는 동안 미사일을 따라다니는 불빛(미사일의 부스터 연소 시간).
help.Effects/HitFlashLight = 포탄이 명중한 곳의 짧은 섬광(물 속 제외).
help.Effects/FlashPower = 섬광의 밝기와 크기, 1 = 기본값.
help.Effects/FlashLimit = 플레이어의 함포, CIWS, 기관총이 최대 사거리 밖의 목표(사거리의 최대 1.5배, 최소 5해리)를 향해 사격 없이 회전하고 앙각을 잡습니다. 최대 사거리에 있는 것처럼. 꺼짐 = 게임과 동일: 목표가 사거리에 들어올 때까지 포탑은 움직이지 않습니다.
help.Effects/DayBrightness = 낮 동안 섬광과 화재 불빛의 밝기, 1 = 줄이지 않음. 한낮에는 불빛에 이 값이 곱해집니다(밤에는 변함 없음). 햇빛과 강한 빛이 겹쳐 흰색과 분홍색으로 날아가는 것을 막습니다.
help.Guns/AimBeyondMaxRange = 낮에는 섬광이 어두워지고(햇빛 아래에서는 흰색과 분홍색으로 날아갑니다), 동시에 존재하는 모든 섬광은 총 밝기 한도를 공유하므로 많은 명중이 한꺼번에 일어나도 화면이 과노출되지 않습니다.
help.Guns/MaxAccuracyMeters = 수상 목표에 대한 함포의 최고(최대) 정확도(미터): 사격통제 거리 오차의 하한. 게임은 약 40 m를 사용하므로 근거리(약 1.4해리까지)에서는 중거리보다 함포가 상대적으로 덜 정확합니다. 거리에 따른 스케일(사거리의 1.5 %)은 유지됩니다. 게임 동작은 약 40으로 설정.
help.Guns/MachineGunBurstFix = 기관총은 매 발사마다 총구 섬광을 표시합니다: 아직 재생 중인 풀링된 섬광 효과를 다시 시작합니다.
help.Guns/MachineGunSoundLoopFix = 기관총의 반복 발사음은 클립의 무음 부분(긴 연사 중간의 틈)을 건너뜁니다.
help.Guns/HitSoundFix = 함포 명중은 항상 폭발음을 재생합니다: 소리가 시작되지 않은 효과(풀링된 인스턴스)를 재생하도록 만듭니다.
help.General/Debug = 상세 로그 및 BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = 모드 텍스트의 언어: 게임 언어 코드(en, ru ...); 비어 있음 = 게임 자체의 언어. 텍스트는 모드 폴더의 lang/<코드>.ini 파일에 있으며, 편집하여 번역할 수 있습니다.
help.Fire/UnknownAirMinKnots = 속도(노트). 이보다 빠르고 함정 쪽으로 접근하는(50 nm 이내) 미식별 항공기를 Weapons 탭의 "On Free" 스위치가 공격합니다. 게임 내 여객기는 순항 약 460-480노트, 최대 560노트입니다.
help.Fire/UnknownAirMaxNm = 거리(nm). 이 안에서 함정 쪽으로 접근하는 고속 미식별 항공기를 Weapons 탭의 "On Free" 스위치가 공격합니다.
help.Fire/UnknownAirDefaultOwn = 아군 및 동맹 함정에 대한 Weapons 탭 "On Free" 스위치의 초기 상태(유닛에서 바꾼 값은 그 유닛과 함께 저장됩니다).
help.Fire/UnknownAirDefaultEnemy = 적 AI 함정에 대한 같은 설정(적 AI가 직접 이런 항공기를 공격합니다).
help.Fire/EngageByPlotRelation = 게임의 AI는 접촉이 플롯에서 적대이고 실제 진영도 적대일 때만 표적으로 삼습니다. 실제 진영은 플레이어가 알 수 없는 정보이므로, 플레이어가 적대로 표시한 접촉(예: 중립 여객기)은 Free 상태의 아군 함정이 절대 공격하지 않습니다. 켬: 아군 함정은 플롯만 따릅니다 - 적대로 표시한 접촉을 공격하고 실제 진영은 무시합니다(치트 없음). 끔 = 게임 기본 동작.
