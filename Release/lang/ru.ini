help.UI/ClickVolume = Громкость щелчка кнопок и переключателей вкладки, 0..1 (0 = без звука; у кнопок игры звука нет).
help.FireControl/GunOneDirector = Открывающее огонь орудие занимает канал цели на ОДНОМ из своих директоров (уже сопровождающем его цель или лучшем свободном), а не на всех, как в игре - остальные директоры остаются свободными для других орудий и для ракет, использующих те же директоры (например, Mk92 + STIR на «Аделаиде», «Top Bow» + «Four Eyes» на «Свердлове»).
help.FireControl/GunChannelLimit = Орудие, у директоров которого нет свободного канала цели, наводится в местном управлении (штраф игры при неработающих директорах: меньший коэффициент решения, большая ошибка в темноте), пока канал не освободится. Выкл = как в игре: орудие наводится лучшим работающим директором, сколько бы целей тот ни сопровождал.
help.UI/SamReadyButton = Кнопка готовности в строках установок, которым нужен прогрев перед стрельбой (ЗРК): клик = подать ракеты сейчас, повторный клик = убрать.
help.UI/SamReadyMinutes = Сколько минут установка остаётся готовой после нажатия кнопки, если ею не пользуются: затем ракеты убираются.
help.Ships/SamAutoCharge = Юниты (и вражеские тоже) заряжают свои пусковые ЗРК (ракеты на направляющие), когда неопознанный самолёт ближе заданной ниже дистанции. Учитываются только контакты, уже обработанные экипажем (цикл OODA игры). Выкл = собственный прогрев игры, начинающийся при известной вражеской цели.
help.Ships/SamKeepLoaded = Заряженная (горячая) установка держит ракеты на направляющих после пуска: игра убирает их в погреб, когда установка некоторое время простаивает (вторая ракета «исчезает» после первого выстрела). Выкл = как в игре.
help.Ships/SamAnimFix = Ракеты движутся при подаче и уборке (вверх из-под палубы / вниз под палубу), даже если в файле боеприпаса нет данных о положении под точным названием системы установки (например, SA-N-1A с боеприпасом SA-N-1): берётся ближайшая подходящая запись.
help.Ships/SamAutoChargeRange = Дистанция (мор. миль) приближающегося неопознанного самолёта, при которой заряжаются пусковые ЗРК.
help.Ships/NoRbuSurfaceChase = Корабль, атакующий надводную цель бомбомётами ПЛО (РБУ), не бежит за ней, чтобы войти в дальность бомбомётов - он держит курс и стреляет, когда цель войдёт в дальность. Все корабли, вражеские тоже.
help.Ships/NoAirChase = Корабль не бежит за самолётами и ракетами, чтобы ввести их в дальность своего оружия - он держит курс и стреляет, когда они войдут в дальность. Все корабли, вражеские тоже.
help.UI/WeaponsTabGroundUnits = Вкладка вооружения для наземной техники и береговых сооружений (юниты с собственными орудиями / пусковыми).
help.UI/WeaponsTabAircraft = Вкладка вооружения для самолётов и вертолётов (их оружие на подвесках: одна группа, «Огонь» для каждого типа боеприпасов, переключатели по типу цели).
help.UI/FireShowsZones = Пока после «Огонь» выбирается цель, на карте и в 3D показываются секторы обстрела и дальность оружия (как игра делает при удержании Alt над оружием в строке состояния юнита).
help.Optics/BinocularsNormalView = Бинокль на максимальном увеличении стартует с обычным видом (игра включает ночной / тепловой фильтр). Клавиша фильтра игры включает фильтр.
help.Optics/NormalViewDayOnly = Обычный вид по умолчанию только днём; ночью остаётся собственный фильтр игры.
help.Effects/FireFlicker = Свет пожара на корабле мерцает, тем глубже и быстрее, чем сильнее пожар (малый / средний / сильный).
help.Effects/FireLightPower = Яркость света пожаров на кораблях (собственный свет пожара игры, умноженный; дальность тоже растёт). 1 = как в игре.
help.Effects/MuzzleFlashLight = Короткая вспышка света у дула при стрельбе орудий, CIWS и пулемётов (видна ночью).
help.Effects/MissileLaunchFlashLight = Свет сопровождает ракету, пока горит её стартовый ускоритель после пуска (время работы ускорителя ракеты).
help.Effects/HitFlashLight = Короткая вспышка света в месте попадания снаряда (не в воду).
help.Effects/FlashPower = Яркость и размер вспышек, 1 = по умолчанию.
help.Guns/AimBeyondMaxRange = Орудия, CIWS и пулемёты игрока поворачиваются и поднимаются к цели за максимальной дальностью (до 1,5 x дальности, не менее 5 миль) без стрельбы, как будто она на максимальной дальности. Выкл = как в игре: башня стоит на месте, пока цель не в дальности.
help.Guns/MaxAccuracyMeters = Лучшая (максимальная) точность орудий по надводным целям, в метрах: нижний предел ошибки дальности СУО. Игра использует около 40 м, поэтому на малой дистанции (до ~1,4 мили) орудия относительно менее точны, чем на средней. Масштабирование с дистанцией (1,5 % дальности) сохраняется. Около 40 = поведение игры.
help.Guns/MachineGunBurstFix = Пулемёты показывают вспышку выстрела на каждом выстреле: ещё играющий эффект вспышки из пула перезапускается.
help.Guns/MachineGunSoundLoopFix = Зацикленный звук стрельбы пулемётов пропускает тихую часть записи (провал посреди длинной очереди).
help.Guns/HitSoundFix = Попадания снарядов всегда проигрывают звук взрыва: эффекту, у которого звук не запустился (экземпляр из пула), звук запускается принудительно.
help.General/Debug = Подробный лог и BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Язык текстов мода: код языка игры (en, ru ...); пусто = язык самой игры. Тексты лежат в файлах lang/<код>.ini в папке мода - правьте их для перевода.
help.Fire/UnknownAirMinKnots = Скорость (уз), выше которой неопознанный самолёт, летящий на корабль (ближе 50 nm), атакуется флажком «On Free: engage unidentified aircraft» вкладки Weapons. Гражданские лайнеры игры идут крейсерской около 460-480 уз, максимум 560.
help.Fire/UnknownAirMaxNm = Дистанция (nm), ближе которой неопознанный быстрый самолёт, летящий на корабль, атакуется флажком «On Free: engage unidentified aircraft» вкладки Weapons.
help.Fire/UnknownAirDefaultOwn = Начальное состояние флажка «On Free: engage unidentified aircraft» вкладки Weapons у ваших кораблей и кораблей союзников (выбор, сделанный на юните, сохраняется вместе с ним).
help.Fire/UnknownAirDefaultEnemy = То же для кораблей противника (ИИ): их ИИ сам атакует такие самолёты.
help.Fire/EngageByPlotRelation = AI игры берёт контакт в цели, только если он враждебен на планшете И его настоящая сторона тоже враждебна. Настоящую сторону игрок знать не может, поэтому контакт, помеченный игроком врагом (например, нейтральный авиалайнер), корабли игрока на Free не атакуют никогда. Вкл: корабли игрока ориентируются только на планшет - помеченные врагом контакты атакуются, настоящая сторона игнорируется (без читерства). Выкл = как в игре.
