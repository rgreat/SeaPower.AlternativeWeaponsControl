ammo.note = Точность: круговое вероятное отклонение, радиус в метрах на максимальной дальности, в пределах которого ложатся снаряды (меньше = точнее). Мощность: мощность боевой части. Значения игры показаны рядом с полями; стрелка возвращает их. ✕ убирает строку из таблицы, список под таблицей добавляет любой другой боеприпас орудий игры. Применяется к боеприпасам, загруженным после «Применить» (старт миссии).
