preset.note = Заполняет настройки директоров ниже (не точность снарядов). Базовый: игра как есть. Улучшенный: слабые директоры точнее, орудия без директора чуть хуже - подходит для игры и для наборов правил со слабыми директорами. WW2 Mod: для набора WW2 (слабые директоры): слабые директоры подтянуты на десятую часть пути к самому слабому директору игры, орудия без директора хуже директоров, решение по стрельбе набирается вдвое медленнее. Применить, чтобы сохранить.
