ammo.more = ...и ещё {0}: введите часть названия, чтобы сузить список
ammo.none = Других боеприпасов орудий нет.
ammo.removeTip = Убрать из таблицы (снова действуют значения игры)
help.Guns/RerollAimError = Игра добавляет к точке прицеливания каждого орудия случайную ошибку СУО и держит её, пока орудие не выстрелит. Вблизи максимальной дальности эта ошибка может вынести точку за пределы таблицы стрельбы: у орудия нет решения, оно даже не поворачивается и не стреляет, потому что ошибка перебрасывается только после выстрела, - башня минутами простаивает, пока соседние стреляют. Вкл = такое орудие сразу получает новую ошибку (только если в саму цель можно попасть). Выкл = как в игре. Только орудия игрока.
help.Guns/BarrelScatter = Игра разыгрывает разброс снарядов один раз на залп и отдаёт его всем стволам установки, поэтому снаряды сдвоенной или строенной башни летят строго параллельно и ложатся в линию, попадая или промахиваясь вместе. Вкл = каждый ствол после первого получает свой разброс снарядов (тот же разброс, что в игре, вокруг той же точки прицеливания). Выкл = как в игре. Надводные цели, морские орудия всех кораблей.
help.Guns/BigGunsLocalSolution = Орудие с уничтоженным или выключенным директором в игре навсегда остаётся с решением 0 (оно лишь повторяет лучший работающий сенсор), поэтому стреляет с полной ошибкой местного управления. У крупных башен есть местное управление и собственные дальномеры. Вкл = морское орудие со снарядом тяжелее 2 кг (примерно от 50 мм) и без работающего директора строит решение само, как орудие без сенсоров (усиление наведения остаётся как у местного управления: хуже, чем у директора). Малые калибры остаются как в игре. Выкл = как в игре.
help.Guns/ClickEngagesAllGuns = Правый клик по вражескому контакту при выбранном своём корабле заставляет игру назначить ОДИН боеприпас орудий - с наибольшей дальностью, у которого в этот момент есть годное орудие (орудие с уничтоженным директором или на перезарядке не считается, и его калибр пропускается). Вкл = приказ получает каждый боеприпас орудий корабля, достающий до цели (только дальность, сектор обстрела не важен). Выкл = как в игре. Только корабли игрока.
help.Guns/LocalControlKeepsFiring = Орудие без рабочего директора (уничтожен, выключен или его нет) наводится по местному управлению. Игра тогда задерживает каждый следующий выстрел, пока не упадёт предыдущий снаряд (пристрелка: один снаряд за время полёта, 30-60 с на большой дальности), пока решение орудия ниже 95 %; при уничтоженном директоре решение остаётся 0, поэтому такое орудие стреляет очень редко. Вкл = без этого ожидания: орудие на местном управлении стреляет с обычной скорострельностью (точность остаётся плохой, как в игре). Выкл = как в игре. Только орудия игрока.
help.Guns/AccuracyMultiplier = Насколько точны сами снаряды: рассеивание снарядов вокруг точки прицеливания делится на это число, так что 2 = вдвое меньше разброс (вдвое точнее), 0,5 = вдвое больше, 1 = как в игре. Значения набора автора и ваши значения в таблице боеприпасов ниже заменяют результат как есть. Действует со старта следующей миссии.
help.Guns/FireControlAccuracy = Насколько точно орудия наводятся на надводные цели, все орудия: ошибка наведения каждого залпа делится на это число (2 = вдвое меньше ошибка, 1 = как в игре). Это поверх всего, что игра уже учитывает (директор, освещение, расчёт, насколько захвачена цель). Рассеивание самих снарядов - другое дело: см. точность снарядов выше. Действует сразу.
help.Guns/WeakDirectorsLift = Какая доля разрыва между очень слабым директором и самым слабым директором игры закрывается, в процентах. Самый слабый директор игры имеет точность 0,75 (игра называет её gain); в некоторых наборах правил (например, WW2) директоры 0,1-0,6, и даже хороший из них целится намного хуже игровых. Директор ниже 0,75 получает прибавку к точности в эту долю разницы до 0,75 (50 = на полпути: 0,35 становится 0,55); его минимальное решение растёт в то же число раз. Лучший директор даёт меньшие ошибки наведения, быстрее набирает решение по стрельбе (Решение % орудия) и реже заставляет орудия ждать всплесков. Директоры от 0,75 не затрагиваются. 0 = как есть, 100 = все слабые директоры не хуже самого слабого директора игры. Действует сразу.
help.Guns/LocalControlGain = Точность орудий без рабочего директора (расчёт наводит сам; игра называет её gain): чем выше, тем меньше ошибки наведения. Собственное значение игры 0,6 - лучше, чем у большинства директоров наборов правил со слабыми директорами; здесь это множитель к нему. 1 = значение игры. Действует сразу.
help.Guns/SolutionBuildSpeed = Как быстро орудия набирают решение по стрельбе (Решение % орудия: насколько хорошо орудие поймало курс и скорость цели; чем оно выше, тем меньше ошибки из-за движения цели и реже ожидание всплесков). Множитель только скорости - точность директора не меняется. Относится к директорам и к орудиям без директора. 1 = как в игре; 0,3 = втрое медленнее. Поворот или смена скорости цели по-прежнему стоит ту же долю решения, поэтому при низкой скорости маневрирующая цель держит решение низким. Действует сразу.
help.Guns/ManeuverSolutionLoss = Сколько решения по стрельбе орудие теряет на каждой проверке (раз в 2 с), если курс цели изменился больше чем на 4 градуса и (или) скорость больше чем на 4 узла: этот процент ТЕКУЩЕГО решения, отдельно за курс и за скорость. Игра отнимает фиксированные 0,1 (10 пунктов) за каждое, как бы ни было велико или мало решение, поэтому орудие с низким решением вообще не может набрать его против маневрирующей цели. 0 = фиксированные 0,1 игры. Действует для директоров и для орудий без директора.
help.Guns/LocalSolutionGrowth = Как быстро крупное орудие без работающего директора (см. «Крупные орудия строят решение без директора») набирает собственное решение, в процентах от скорости роста ЛУЧШЕГО из его директоров (сильнейший из привязанных сенсоров, работающий или нет: усиление x экипаж x освещённость). Орудие без сенсоров в игре набирает решение со скоростью одного экипажа, а это быстрее слабого директора (усиление 0,3-0,5), так что потеря директора становится выгодой. 75 = три четверти скорости директора. Орудие вообще без привязанных сенсоров берёт СРЕДНИЙ директор всех юнитов миссии (тот же процент от него), так что оно тоже не быстрее директора.
help.Guns/OpticalDirectorMinSolution = Минимальное решение по стрельбе с оптическим директором: решение (насколько хорошо орудие поймало курс и скорость цели, показано как Решение % орудия, 0..1) никогда не падает ниже этого уровня и начинается с него, поэтому орудия раньше попадают после открытия огня и реже ждут всплесков. Это множитель собственного минимума директора (ключ ини сенсора FCMinSolution); 1 = как у директора.
help.Guns/RadarDirectorMinSolution = Минимальное решение по стрельбе с радарным директором: решение (насколько хорошо орудие поймало курс и скорость цели, показано как Решение % орудия, 0..1) никогда не падает ниже этого уровня и начинается с него, поэтому орудия раньше попадают после открытия огня и реже ждут всплесков. Это множитель собственного минимума директора (ключ ини сенсора FCMinSolution); 1 = как у директора.
