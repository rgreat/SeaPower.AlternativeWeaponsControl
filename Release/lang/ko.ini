help.UI/ClickVolume = 탭 버튼과 스위치의 클릭 음량, 0..1 (0 = 소리 없음; 게임 자체 버튼은 소리가 없습니다).
help.FireControl/GunOneDirector = 사격을 시작하는 함포는 게임처럼 모든 디렉터가 아니라 디렉터 하나(이미 목표를 추적 중인 것 또는 가장 좋은 빈 것)에서 목표 채널을 사용합니다 - 그래서 다른 디렉터는 다른 함포와 같은 디렉터를 공유하는 미사일을 위해 비어 있게 됩니다(예: 애들레이드의 Mk92 + STIR, 스베르들로프의 Top Bow + Four Eyes).
help.FireControl/GunChannelLimit = 디렉터에 목표용 빈 채널이 없는 함포는 채널이 비워질 때까지 로컬 통제로 조준합니다(작동하는 디렉터가 없을 때의 게임 페널티: 해결 이득 감소, 어둠에서 더 큰 오차). 꺼짐 = 게임과 동일: 해당 디렉터가 이미 몇 개의 목표를 추적하든 가장 좋은 작동 디렉터로 조준합니다.
help.UI/SamReadyButton = 발사 전 예열이 필요한 발사대(SAM)의 행에 준비 버튼: 클릭 = 지금 미사일 장전, 다시 클릭 = 격납.
help.UI/SamReadyMinutes = 버튼을 누른 뒤 사용하지 않을 때 발사대가 준비 상태를 유지하는 시간(분): 이후 미사일을 격납합니다.
help.Ships/SamAutoCharge = 유닛(적 포함)은 미확인 항공기가 아래 거리보다 가까워지면 SAM 발사대를 장전합니다(미사일을 레일에). 승조원이 이미 처리한 접촉(게임의 OODA 루프)만 해당합니다. 꺼짐 = 적 목표가 알려지면 시작되는 게임 자체의 예열.
help.Ships/SamKeepLoaded = 장전된(뜨거운) 발사대는 발사 후에도 미사일을 레일에 유지합니다: 게임은 발사대가 한동안 유휴 상태이면 탄약고로 내립니다(첫 발사 후 두 번째 미사일이 「사라짐」). 꺼짐 = 게임과 동일.
help.Ships/SamAnimFix = 탄약 파일에 발사대의 정확한 시스템 이름으로 된 위치 데이터가 없어도 미사일이 장전 및 격납 시 움직입니다(갑판 아래에서 올라오고 / 아래로 내려감)(예: SA-N-1 탄약을 쓰는 SA-N-1A): 가장 가까운 일치 항목을 사용합니다.
help.Ships/SamAutoChargeRange = 접근하는 미확인 항공기가 SAM 발사대 장전을 일으키는 거리(해리).
help.Ships/NoRbuSurfaceChase = 대잠 박격포(RBU)로 수상 목표를 공격하는 함정은 박격포 사거리에 들어가기 위해 추격하지 않습니다 - 침로를 유지하고 목표가 사거리에 들어오면 사격합니다. 모든 함정(적 포함).
help.Ships/NoAirChase = 함정은 항공기와 미사일을 무기 사거리에 넣기 위해 추격하지 않습니다 - 침로를 유지하고 사거리에 들어오면 사격합니다. 모든 함정(적 포함).
help.UI/WeaponsTabGroundUnits = 지상 차량과 육상 시설(자체 함포 / 발사대가 있는 유닛)용 무장 탭.
help.UI/WeaponsTabAircraft = 항공기와 헬리콥터용 무장 탭(하드포인트의 무기: 한 그룹, 탄약 종류별 사격, 목표 종류별 스위치).
help.UI/FireShowsZones = 사격 후 목표를 고르는 동안 무기의 사격 범위와 사거리가 지도와 3D에 표시됩니다(유닛 상태 줄에서 무기 위에 Alt를 누를 때 게임이 하는 것과 같음).
help.Guns/AimBeyondMaxRange = 플레이어의 함포·CIWS·기관총이 최대 사거리 밖(사거리의 최대 1.5배, 최소 5해리)이거나 사격 구역 밖의 목표를 (구역이 허용하는 범위까지) 사격 없이 향해 선회·고각을 맞춥니다. 끔 = 게임 기본: 목표가 사거리와 구역 안에 들어올 때까지 포탑은 움직이지 않습니다.
help.Guns/MaxAccuracyMeters = 수상 목표에 대한 함포의 최고(최대) 정확도(미터): 사격통제 거리 오차의 하한. 게임은 약 40 m를 사용하므로 근거리(약 1.4해리까지)에서는 중거리보다 함포가 상대적으로 덜 정확합니다. 거리에 따른 스케일(사거리의 1.5 %)은 유지됩니다. 게임 동작은 약 40으로 설정.
help.General/Debug = 상세 로그 및 BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = 모드 텍스트의 언어: 게임 언어 코드(en, ru ...); 비어 있음 = 게임 자체의 언어. 텍스트는 모드 폴더의 lang/<코드>.ini 파일에 있으며, 편집하여 번역할 수 있습니다.
help.Fire/UnknownAirMinKnots = 속도(노트). 이보다 빠르고 함정 쪽으로 접근하는(50 nm 이내) 미식별 항공기를 Weapons 탭의 "On Free" 스위치가 공격합니다. 게임 내 여객기는 순항 약 460-480노트, 최대 560노트입니다.
help.Fire/UnknownAirMaxNm = 거리(nm). 이 안에서 함정 쪽으로 접근하는 고속 미식별 항공기를 Weapons 탭의 "On Free" 스위치가 공격합니다.
help.Fire/UnknownAirDefaultOwn = 아군 및 동맹 함정에 대한 Weapons 탭 "On Free" 스위치의 초기 상태(유닛에서 바꾼 값은 그 유닛과 함께 저장됩니다).
help.Fire/UnknownAirDefaultEnemy = 적 AI 함정에 대한 같은 설정(적 AI가 직접 이런 항공기를 공격합니다).
help.Fire/EngageByPlotRelation = 게임의 AI는 접촉이 플롯에서 적대이고 실제 진영도 적대일 때만 표적으로 삼습니다. 실제 진영은 플레이어가 알 수 없는 정보이므로, 플레이어가 적대로 표시한 접촉(예: 중립 여객기)은 Free 상태의 아군 함정이 절대 공격하지 않습니다. 켬: 아군 함정은 플롯만 따릅니다 - 적대로 표시한 접촉을 공격하고 실제 진영은 무시합니다(치트 없음). 끔 = 게임 기본 동작.
help.Fire/SamTightNezOnly = 「제한」 시 아군 함정의 함대공 미사일 자동 사격은 최대 사거리에서 쏘지 않고, 항공기가 미사일의 회피 불가 구역(항공기가 미사일에서 벗어날 수 없는 거리. 게임이 지도와 툴팁에 계산하는 값) 안에 들어올 때까지 기다립니다. 플레이어의 명령과 「자유」는 영향을 받지 않습니다. 끔 = 게임 기본값.
help.Guns/AmmunitionFix = 포 탄약의 정확도 (공산오차)와 탄두 위력은 제작자 팩 (모드 폴더의 ammunition_fix.txt)과 아래 표에 설정한 값에서 가져옵니다. 표에서 게임의 모든 포 탄약을 추가하거나 행을 제거할 수 있습니다. 꺼짐 = 게임 자체의 탄약 값. 적용 후 불러오는 탄약 (임무 시작)에 반영됩니다.
help.Guns/EngageOutsideSector = 전함·순양함 함포와 일부 CIWS 같은 대형 무장은 게임에서 EngageOnlyInsideArc=True여서 사격 구역 밖 목표를 받지 못합니다. 켬 = 이 제한을 무시하고, 무장이 그런 목표를 받아 구역의 가장 가까운 가장자리로 선회합니다(목표가 구역 안에 들어오기 전에는 사격하지 않음). 변경 후 로드되는 유닛(미션 시작)에 적용됩니다. 위 옵션과 함께 작동합니다.
help.Guns/RememberTargets = 새 사격 명령이 내려지면 이전처럼 함포가 새 표적으로 전환되지만, 이전 표적도 잊지 않습니다. 새 표적에 닿지 않는 함포(사거리 밖 또는 사격 구역 밖)는 닿을 수 있는 가장 최근의 이전 표적을 계속 쏘고, 가능해지면 가장 최근 표적으로 돌아갑니다. 사격 중지는 목록을 지웁니다. 끔 = 게임 기본: 새 명령이 이전 명령을 대체합니다.
help.UI/BottomPanelFire = 화면 하단 패널의 무기를 클릭하면 무기 탭의 Fire 버튼처럼 동작합니다. 무기의 사격 구역과 사거리가 지도와 3D에 빨간색으로 표시되고 게임의 빨간 사거리 원은 숨겨집니다. 'Fire shows weapon arcs and range'가 필요합니다.
help.UI/SectionTargetTypes = 무기 탭의 SAM 그룹 제목에 대공 미사일의 다른 표적 종류도 함께 표시합니다(SAM/ANTI-SHIP: 함선도 공격할 수 있는 SAM). SAM이 아닌 미사일의 다른 표적 종류(ANTI-SHIP/ASW: 함선과 잠수함을 공격하는 미사일)는 항상 표시됩니다.
gt.radar = 레이더 디렉터로 조준: {0}
gt.optical = 광학 디렉터로 조준: {0}
gt.trimmed = 사격지휘장치 {0}(으)로 조준: 레이더 꺼짐(Strict EMCON), 광학 모드
gt.dir = 디렉터: 해 계수 {0}, 최소 해 {1}%
gt.tracks = , 포탄 물기둥 추적
gt.local = 국지 통제 (포에 디렉터 없음)
gt.localNoDir = 국지 통제 (작동하는 디렉터 없음)
gt.localGain = 국지 통제 해 계수 {0}
gt.solution = 사격 해 {0}%
gt.waits = 직전 일제 사격의 탄착 대기 중
gt.errAt = {0} km 조준 오차 (1시그마):
gt.errRef = {0} km, 정지 표적 조준 오차:
gt.err = 거리 {0} m, 방위 {1} m
gt.errPred = , 표적 이동 {0} m
gt.errStab = , 자함 동요 {0} m
gt.scatter = 이 거리에서 포탄 산포: 종 {0} m, 횡 {1} m
gt.note = 더 좋은 디렉터와 더 높은 해일수록 오차가 작아지며, 어둠은 광학 조준에 불리합니다. 모드 배율이 포함되어 있습니다.
grp.global = 전체
grp.directors = 디렉터
lbl.Guns/RerollAimError = 원거리 멈춘 포 풀기
lbl.Guns/BarrelScatter = 포탑의 각 포신마다 개별 산포
lbl.Guns/PointFire = 지도 지점 사격
lbl.Guns/BigGunsLocalSolution = 대구경 포는 디렉터 없이 사격 해를 만든다
lbl.Guns/ClickEngagesAllGuns = 표적 클릭: 모든 포
lbl.Guns/LocalControlKeepsFiring = 국지 통제: 탄착 대기 없음
lbl.Guns/AccuracyMultiplier = 포탄 정확도
lbl.Guns/FireControlAccuracy = 조준 정확도
lbl.Guns/WeakDirectorsLift = 약한 디렉터 보강
lbl.Guns/StrictEmconOpticalShare = Strict EMCON 시 포 레이더 사격지휘장치: 레이더 정확도 비율
lbl.Guns/LocalControlGain = 디렉터 없을 때 해 품질
lbl.Guns/OpticalDirectorMinSolution = 광학 디렉터의 해 품질
lbl.Guns/SolutionBuildSpeed = 사격 해 구축 속도
lbl.Guns/ManeuverSolutionLoss = 표적 기동 시 사격 해 손실
lbl.Guns/LocalSolutionGrowth = 디렉터 없는 사격 해 구축 속도
lbl.Guns/RadarDirectorMinSolution = 레이더 디렉터의 해 품질
preset.title = 디렉터 프리셋
preset.base = 기본
preset.advanced = 고급
preset.ww2 = WW2 Mod
preset.custom = 사용자 지정 값
preset.note = 아래 디렉터 설정을 채웁니다 (포탄 정확도는 제외). 기본: 게임 그대로. 고급: 약한 디렉터는 더 정확하게, 디렉터 없는 포는 조금 나쁘게 - 게임과 약한 디렉터 규칙 세트에 맞습니다. WW2 Mod: WW2 팩 (약한 디렉터)용: 약한 디렉터를 게임에서 가장 약한 디렉터와의 차이의 10분의 1만큼 끌어올리고, 디렉터 없는 포는 디렉터보다 나쁘며, 사격 해는 절반 속도로 구축됩니다. 저장하려면 적용하세요.
ammo.add = 탄약 추가:
ammo.more = ...외 {0}개: 입력하여 목록 좁히기
ammo.none = 더 이상 포 탄약이 없습니다.
ammo.removeTip = 표에서 제거 (게임의 값이 다시 적용됨)
help.Guns/RerollAimError = 게임은 각 포의 조준점에 무작위 사격통제 오차를 더하고 포가 발사할 때까지 유지합니다. 최대 사거리 근처에서는 이 오차가 조준점을 사격표 밖으로 밀어낼 수 있으며, 그러면 포는 해가 없어 회전조차 하지 않고 영영 쏘지 않습니다. 오차는 발사 후에만 다시 뽑히기 때문입니다 - 이웃 포가 쏘는 동안 포탑이 몇 분간 멈춰 있습니다. 켜짐 = 그런 포가 즉시 새 오차를 뽑습니다 (표적 자체를 맞힐 수 있을 때만). 꺼짐 = 게임과 동일. 플레이어의 포만 해당.
help.Guns/BarrelScatter = 게임은 포탄 산포를 일제 사격당 한 번만 정해 포가의 모든 포신에 줄 뿐이라, 쌍열·3연장 포탑의 포탄은 완전히 평행하게 날아가 일렬로 떨어지고 함께 명중하거나 빗나갑니다. 켜짐 = 첫 포신 이후의 각 포신이 자신의 산포를 따로 정합니다 (게임과 같은 산포, 같은 조준점 주변). 꺼짐 = 게임과 동일. 수상 표적, 모든 함정의 함포.
help.Guns/PointFire = 게임에서 포는 물체에만 사격할 수 있어, 빈 지도를 클릭하면 '표적 필요'라고 표시됩니다. 켜짐 = 지도를 우클릭하면 그 지점에 보이지 않는 미끼 표적이 놓이고 포가 일반 표적처럼 공격합니다(명령을 가진 포가 없어지면 삭제됩니다). 꺼짐 = 게임 기본. 플레이어의 함포.
help.Guns/BigGunsLocalSolution = 디렉터가 파괴되거나 꺼진 포는 게임에서 사격 해가 영원히 0에 머물며 (작동 중인 최선의 센서를 따를 뿐) 국지 통제의 전체 오차로 쏩니다. 대형 포탑에는 국지 통제와 자체 거리 측정기가 있습니다. 켜짐 = 포탄이 2 kg보다 무거운 (대략 50 mm 이상) 함포 중 작동하는 디렉터가 없는 포는 센서 없는 포처럼 사격 해를 스스로 만듭니다 (조준 이득은 국지 통제 그대로: 디렉터보다 나쁨). 작은 포는 게임과 동일. 꺼짐 = 게임과 동일.
help.Guns/ClickEngagesAllGuns = 자함을 선택하고 적 접촉을 우클릭하면 게임은 포 탄약 하나만 명령합니다 - 그 순간 쓸 수 있는 포가 있는 탄약 중 사거리가 가장 긴 것 (디렉터가 파괴되었거나 재장전 중인 포는 세지 않으므로 그 구경은 건너뜁니다). 켜짐 = 표적에 닿는 함의 모든 포 탄약이 명령을 받습니다 (사거리만, 사격 구역은 무관). 꺼짐 = 게임과 동일. 플레이어의 함선만 해당.
help.Guns/LocalControlKeepsFiring = 작동하는 디렉터가 없는 포 (파괴, 꺼짐, 또는 없음)는 국지 통제로 조준합니다. 그러면 게임은 포의 사격 해가 95% 미만인 동안 이전 포탄이 떨어질 때까지 다음 발사를 붙잡습니다 (관측 사격: 비행 시간당 포탄 1발, 원거리에서 30-60초). 디렉터가 파괴되면 해가 0에 머물러 그 포는 거의 쏘지 않습니다. 켜짐 = 이 대기 없음: 국지 통제 포도 평소 발사 속도로 쏩니다 (정확도는 게임처럼 나쁜 상태). 꺼짐 = 게임과 동일. 플레이어의 포만 해당.
help.Guns/AccuracyMultiplier = 포탄 자체가 얼마나 정확한지: 조준점 주변 포탄 산포를 이 수로 나눕니다. 2 = 산포 절반 (두 배 정확), 0.5 = 산포 두 배, 1 = 게임과 동일. 제작자 팩의 값과 아래 탄약 표의 사용자 값은 결과를 그대로 대체합니다. 다음 임무 시작부터 적용.
help.Guns/FireControlAccuracy = 수상 표적에 대한 포의 조준 정확도 (모든 포): 매 일제 사격의 조준 오차를 이 수로 나눕니다 (2 = 오차 절반, 1 = 게임과 동일). 게임이 이미 반영하는 모든 것 (디렉터, 조명, 승조원, 표적 고정 정도) 위에 더해집니다. 포탄 자체의 산포는 별개입니다: 위의 포탄 정확도를 보세요. 즉시 적용.
help.Guns/WeakDirectorsLift = 매우 약한 디렉터와 게임에서 가장 약한 디렉터 사이의 격차를 몇 퍼센트 메울지. 게임에서 가장 약한 디렉터의 정확도는 0.75 (게임은 gain이라 부름)입니다. 일부 규칙 세트 (예: WW2 팩)에는 0.1-0.6인 디렉터가 있고, 그중 좋은 것도 게임 자체보다 조준이 훨씬 나쁩니다. 0.75 미만인 디렉터는 0.75와의 차이 중 이 비율만큼 정확도가 올라갑니다 (50 = 중간: 0.35가 0.55가 됨). 최소 해도 같은 배율로 커집니다. 더 좋은 디렉터는 조준 오차가 작고, 사격 해 (포의 해 %)를 더 빨리 구축하며, 포가 탄착을 기다리는 일이 줄어듭니다. 0.75 이상은 건드리지 않습니다. 0 = 그대로, 100 = 모든 약한 디렉터가 게임 최약체와 동급. 즉시 적용.
help.Guns/LocalControlGain = 작동하는 디렉터가 없는 포 (포 승조원이 직접 조준; 게임은 gain이라 부름)의 정확도: 높을수록 조준 오차가 작습니다. 게임 자체 값은 0.6으로, 약한 디렉터 규칙 세트의 대부분 디렉터보다 좋습니다. 이것은 그 값에 대한 배율입니다. 1 = 게임의 값. 즉시 적용.
help.Guns/SolutionBuildSpeed = 포가 사격 해 (포의 해 %: 표적의 침로와 속력을 얼마나 잡았는지, 해가 높을수록 표적 이동에 따른 조준 오차와 탄착 대기가 줄어듦)를 구축하는 속도. 속도에만 곱하는 배율이며 디렉터의 정확도는 변하지 않습니다. 디렉터와 디렉터 없는 포 모두에 적용됩니다. 1 = 게임과 동일, 0.3 = 3배 느림. 표적의 변침이나 속력 변화는 여전히 같은 몫의 해를 깎으므로 낮은 속도에서는 기동하는 표적이 해를 낮게 유지합니다. 즉시 적용.
help.Guns/ManeuverSolutionLoss = 표적의 침로가 4도 넘게, 또는 속력이 4노트 넘게 바뀌었을 때 포가 매 점검 (2초마다) 잃는 사격 해의 양: 현재 사격 해의 이 비율을 침로와 속력에 대해 각각 한 번씩. 게임은 해의 높낮이와 상관없이 고정 0.1 (10포인트)씩 빼므로, 해가 낮은 포는 기동하는 표적에 대해 해를 전혀 쌓을 수 없습니다. 0 = 게임의 고정 0.1. 디렉터와 디렉터 없는 포 모두에 적용됩니다.
help.Guns/LocalSolutionGrowth = 작동하는 디렉터가 없는 대구경 포 (「대구경 포는 디렉터 없이 사격 해를 만든다」 참조)가 자체 사격 해를 만드는 속도를, 그 포의 최선의 디렉터 (연결된 센서 중 가장 강한 것, 작동 여부 무관: 이득 x 승무원 x 조명)의 성장 속도에 대한 비율로 정합니다. 게임에서 센서가 전혀 없는 포는 승무원 속도만으로 구축하는데, 이는 약한 디렉터 (이득 0.3-0.5)보다 빨라 디렉터를 잃는 것이 오히려 이득이 됩니다. 75 = 디렉터 속도의 4분의 3. 연결된 센서가 아예 없는 포는 임무 내 모든 유닛의 평균 디렉터 (같은 비율)를 기준으로 하므로 디렉터보다 빠르지 않습니다.
help.Guns/OpticalDirectorMinSolution = 광학 디렉터 사용 시 최소 사격 해: 해 (포가 표적의 침로와 속력을 얼마나 잡았는지, 포의 해 %로 표시, 0..1)는 이 수준 아래로 떨어지지 않고 이 수준에서 시작하므로 포가 사격 개시 후 더 빨리 명중하고 탄착을 덜 기다립니다. 디렉터 자체 최소값 (센서 ini 키 FCMinSolution)에 대한 배율입니다. 1 = 디렉터 그대로.
help.Guns/RadarDirectorMinSolution = 레이더 디렉터 사용 시 최소 사격 해: 해 (포가 표적의 침로와 속력을 얼마나 잡았는지, 포의 해 %로 표시, 0..1)는 이 수준 아래로 떨어지지 않고 이 수준에서 시작하므로 포가 사격 개시 후 더 빨리 명중하고 탄착을 덜 기다립니다. 디렉터 자체 최소값 (센서 ini 키 FCMinSolution)에 대한 배율입니다. 1 = 디렉터 그대로.
