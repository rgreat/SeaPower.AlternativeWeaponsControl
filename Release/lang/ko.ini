ammo.note = 정확도: 공산오차 (CEP), 최대 사거리에서 포탄이 떨어지는 반경 (미터, 작을수록 정확). 위력: 탄두 위력. 게임의 값은 입력란 옆에 표시되며 화살표로 되돌립니다. ✕ 는 표에서 행을 제거하고, 표 아래 목록은 게임의 다른 포 탄약을 추가합니다. 적용 후 불러오는 탄약 (임무 시작)에 반영됩니다.
