ammo.note = Genauigkeit: wahrscheinlicher Kreisfehler, der Radius in Metern bei maximaler Reichweite, innerhalb dessen die Granaten landen (kleiner = genauer). Wirkung: Gefechtskopfstärke. Die Werte des Spiels stehen neben den Feldern; der Pfeil stellt sie wieder her. Mit ✕ entfernen Sie eine Zeile aus der Tabelle, über die Liste unter der Tabelle fügen Sie jede andere Geschützmunition des Spiels hinzu. Gilt für Munition, die nach Übernehmen geladen wird (Missionsstart).
