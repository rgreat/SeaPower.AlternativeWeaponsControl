ammo.note = Genauigkeit: Streukreisradius in Metern bei maximaler Reichweite, innerhalb dessen die Granaten landen (kleiner = genauer). Wirkung: Gefechtskopfwirkung. Die Werte des Spiels stehen neben den Feldern; der Pfeil stellt sie wieder her. Gilt für Munition, die nach „Übernehmen“ geladen wird (Missionsstart).
