help.UI/ClickVolume = Lautstärke des Klickens der Tab-Schaltflächen und Schalter, 0..1 (0 = kein Ton; die Schaltflächen des Spiels machen keinen).
help.FireControl/GunOneDirector = Ein feuerndes Geschütz belegt einen Zielkanal an EINEM seiner Direktoren (dem, der sein Ziel bereits verfolgt, oder dem besten freien), nicht an allen wie im Spiel - so bleiben die anderen Direktoren frei für andere Geschütze und für Raketen, die sich dieselben Direktoren teilen (z. B. Mk92 + STIR auf der Adelaide, Top Bow + Four Eyes auf der Swerdlow).
help.FireControl/GunChannelLimit = Ein Geschütz, dessen Direktoren keinen freien Zielkanal für sein Ziel haben, zielt mit lokaler Steuerung (Spielstrafe bei keinem funktionierenden Direktor: geringerer Lösungsgewinn, größerer Fehler im Dunkeln), bis ein Kanal frei wird. Aus = wie im Spiel: ein Geschütz zielt mit seinem besten funktionierenden Direktor, egal wie viele Ziele dieser schon verfolgt.
help.UI/SamReadyButton = Ein Bereitschaftsknopf in den Zeilen von Werfern, die vor dem Feuern aufwärmen (FlaRak): Klick = Raketen jetzt laden, erneut klicken = verstauen.
help.UI/SamReadyMinutes = Minuten, die der Werfer nach dem Knopfdruck bereit bleibt, wenn er nicht benutzt wird: dann werden die Raketen verstaut.
help.Ships/SamAutoCharge = Einheiten (auch gegnerische) laden ihre FlaRak-Werfer (Raketen auf die Schienen), wenn ein unbekanntes Flugzeug näher kommt als die unten eingestellte Entfernung. Es zählen nur Kontakte, die die Besatzung bereits verarbeitet hat (OODA-Schleife des Spiels). Aus = das eigene Aufwärmen des Spiels, das beginnt, wenn ein feindliches Ziel bekannt ist.
help.Ships/SamKeepLoaded = Ein geladener (heißer) Werfer behält die Raketen nach einem Start auf den Schienen: das Spiel entlädt sie ins Magazin, wenn der Werfer eine Weile untätig war (eine zweite Rakete „verschwindet“ nach dem ersten Schuss). Aus = wie im Spiel.
help.Ships/SamAnimFix = Raketen bewegen sich beim Laden und Entladen (hoch aus / hinunter unter das Deck), auch wenn die Munitionsdatei keine Positionsdaten unter dem genauen Systemnamen des Werfers hat (z. B. SA-N-1A mit SA-N-1-Munition): der nächstpassende Eintrag wird verwendet.
help.Ships/SamAutoChargeRange = Entfernung (sm) eines sich nähernden unbekannten Flugzeugs, bei der die FlaRak-Werfer geladen werden.
help.Ships/NoRbuSurfaceChase = Ein Schiff, das ein Überwasserziel mit U-Jagd-Werfern (RBU) angreift, jagt ihm nicht hinterher, um in die Reichweite der Werfer zu kommen - es hält den Kurs und feuert, sobald das Ziel in Reichweite kommt. Alle Schiffe, auch gegnerische.
help.Ships/NoAirChase = Ein Schiff jagt Flugzeugen und Raketen nicht hinterher, um sie in die Reichweite seiner Waffen zu bringen - es hält den Kurs und feuert, sobald sie in Reichweite kommen. Alle Schiffe, auch gegnerische.
help.UI/WeaponsTabGroundUnits = Der Waffen-Tab für Bodenfahrzeuge und Landanlagen (die Einheiten mit eigenen Geschützen / Werfern).
help.UI/WeaponsTabAircraft = Der Waffen-Tab für Flugzeuge und Hubschrauber (ihre Waffen an den Außenlastträgern: eine Gruppe, ein Feuer pro Munitionsart, Schalter nach Zieltyp).
help.UI/FireShowsZones = Während nach Feuer das Ziel gewählt wird, werden die Schussbereiche und die Reichweite der Waffen auf der Karte und in 3D angezeigt (wie es das Spiel bei gehaltener Alt-Taste über einer Waffe in der Statuszeile der Einheit tut).
help.Guns/AimBeyondMaxRange = Geschütze, CIWS und MGs des Spielers drehen und heben sich zu einem Ziel jenseits der Maximalreichweite (bis 1,5 x Reichweite, mindestens 5 sm) oder außerhalb ihres Feuersektors (soweit der Sektor es erlaubt), ohne zu feuern. Aus = wie im Spiel: Der Turm bleibt stehen, bis das Ziel in Reichweite und im Sektor ist.
help.Guns/MaxAccuracyMeters = Beste (maximale) Genauigkeit der Geschütze gegen Überwasserziele in Metern: die Untergrenze des Feuerleit-Entfernungsfehlers. Das Spiel nutzt etwa 40 m, daher sind Geschütze auf kurze Entfernung (bis ~1,4 sm) relativ ungenauer als auf mittlere. Die Skalierung mit der Entfernung (1,5 % der Reichweite) bleibt. Etwa 40 einstellen für das Spielverhalten.
help.General/Debug = Ausführliche Protokollierung und BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Sprache der Mod-Texte: ein Code einer Spielsprache (en, ru ...); leer = die eigene Sprache des Spiels. Die Texte stehen in den Dateien lang/<Code>.ini im Mod-Ordner - zum Übersetzen bearbeiten.
help.Fire/UnknownAirMinKnots = Geschwindigkeit (kn), ab der ein auf das Schiff zufliegendes unidentifiziertes Flugzeug (näher als 50 nm) vom Schalter „On Free“ der Weapons-Seite bekämpft wird. Verkehrsflugzeuge des Spiels fliegen etwa 460-480 kn, höchstens 560.
help.Fire/UnknownAirMaxNm = Entfernung (nm), innerhalb der ein schnelles, auf das Schiff zufliegendes unidentifiziertes Flugzeug vom Schalter „On Free“ der Weapons-Seite bekämpft wird.
help.Fire/UnknownAirDefaultOwn = Anfangszustand des Schalters „On Free“ der Weapons-Seite für Ihre und verbündete Schiffe (ein am Schiff gesetzter Wert bleibt bei ihm).
help.Fire/UnknownAirDefaultEnemy = Dasselbe für KI-Schiffe des Gegners (ihre KI bekämpft solche Flugzeuge selbst).
help.Fire/EngageByPlotRelation = Die KI des Spiels nimmt einen Kontakt nur dann als Ziel, wenn er auf dem Plot feindlich ist UND seine wahre Seite ebenfalls feindlich ist. Die wahre Seite kann der Spieler nicht kennen; deshalb greifen die Schiffe des Spielers auf Free einen vom Spieler als feindlich markierten Kontakt (z. B. ein neutrales Verkehrsflugzeug) nie an. Ein: Die Schiffe des Spielers richten sich nur nach dem Plot - als feindlich markierte Kontakte werden angegriffen, die wahre Seite wird ignoriert (kein Schummeln). Aus = wie im Spiel.
help.Fire/SamTightNezOnly = Bei „Eingeschränkt“ wartet das automatische Feuer der Flugabwehrraketen Ihrer Schiffe, bis ein Flugzeug in der Fluchtunmöglichkeitszone der Rakete ist (die Entfernung, innerhalb derer das Flugzeug ihr nicht mehr entkommen kann, wie das Spiel sie für Karte und Tooltip berechnet), statt auf maximale Reichweite zu feuern. Befehle des Spielers und „Frei“ bleiben unberührt. Aus = wie im Spiel.
help.Guns/AmmunitionFix = Genauigkeit (wahrscheinlicher Kreisfehler) und Gefechtskopfstärke der Geschützmunition stammen aus dem Autorenpaket (ammunition_fix.txt im Mod-Ordner) und aus den Werten, die Sie in der Tabelle unten setzen; in der Tabelle lässt sich jede Geschützmunition des Spiels hinzufügen oder eine Zeile entfernen. Aus = die eigenen Munitionswerte des Spiels. Gilt für Munition, die nach Übernehmen geladen wird (Missionsstart).
help.Guns/EngageOutsideSector = Viele große Waffen (Schlachtschiff- und Kreuzergeschütze, einige CIWS) haben im Spiel EngageOnlyInsideArc=True: Sie bekommen nie ein Ziel außerhalb ihres Feuersektors zugewiesen. An = diese Einschränkung wird ignoriert; die Waffe nimmt ein solches Ziel an und dreht zum nächsten Rand ihres Sektors (und feuert erst, wenn das Ziel darin ist). Gilt für Einheiten, die nach der Änderung geladen werden (Missionsstart). Wirkt zusammen mit der Option darüber.
help.Guns/RememberTargets = Ein neuer Feuerbefehl lenkt die Geschütze wie bisher auf das neue Ziel, aber die früheren Ziele werden nicht vergessen: Ein Geschütz, das das neue Ziel nicht erreicht (außer Reichweite oder außerhalb seines Feuersektors), schießt weiter auf das neueste frühere Ziel, das es erreicht, und kehrt zum neuesten zurück, sobald es kann. Feuer einstellen leert die Liste. Aus = wie im Spiel: Jeder neue Befehl ersetzt den alten.
help.UI/BottomPanelFire = Ein Klick auf eine Waffe in der Leiste am unteren Bildschirmrand wirkt wie die Fire-Schaltfläche des Waffen-Tabs: Feuersektoren und Reichweite der Waffen werden rot auf der Karte und in 3D gezeigt, der rote Reichweitenkreis des Spiels wird ausgeblendet. Benötigt „Fire shows weapon arcs and range“.
help.UI/SectionTargetTypes = Der Titel einer SAM-Gruppe im Waffen-Tab nennt auch die weiteren Zieltypen der Flugabwehrraketen: SAM/ANTI-SHIP (eine Flugabwehrrakete, die auch Schiffe bekämpfen kann). Die weiteren Zieltypen anderer Flugkörper (ANTI-SHIP/ASW: ein Flugkörper gegen Schiffe und U-Boote) werden immer genannt.
