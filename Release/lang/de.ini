preset.note = Füllt die Direktor-Einstellungen unten (nicht die Granatgenauigkeit). Basis: das Spiel, wie es ist. Erweitert: schwache Direktoren genauer, Geschütze ohne Direktor etwas schlechter - passt zum Spiel und zu Regelsätzen mit schwachen Direktoren. WW2 Mod: für das WW2-Paket (schwache Direktoren): schwache Direktoren um ein Zehntel des Wegs zum schwächsten Direktor des Spiels angehoben, Geschütze ohne Direktor schlechter als Direktoren, die Feuerlösung baut sich nur halb so schnell auf. Zum Speichern übernehmen.
