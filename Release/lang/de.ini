help.Guns/RerollAimError = Das Spiel addiert zum Zielpunkt jedes Geschützes einen zufälligen Feuerleitfehler und behält ihn, bis das Geschütz geschossen hat. Nahe der maximalen Reichweite kann dieser Fehler den Zielpunkt aus der Schusstafel schieben: das Geschütz hat dann keine Lösung, dreht sich nicht einmal und schießt nie, weil der Fehler erst nach einem Schuss neu gewürfelt wird - ein Turm steht minutenlang still, während die Nachbarn schießen. An = ein solches Geschütz bekommt sofort einen neuen Fehler (nur wenn das Ziel selbst getroffen werden kann). Aus = wie im Spiel. Nur Geschütze des Spielers.
help.Guns/BarrelScatter = Das Spiel würfelt die Streuung der Granaten einmal pro Salve und gibt sie jedem Rohr der Lafette, daher fliegen die Granaten eines Zwillings- oder Drillingsturms exakt parallel, schlagen in einer Linie ein und treffen oder verfehlen gemeinsam. An = jedes Rohr nach dem ersten würfelt seine eigene Streuung (dieselbe Streuung wie im Spiel, um denselben Zielpunkt). Aus = wie im Spiel. Seeziele, Schiffsgeschütze aller Schiffe.
help.Guns/PointFire = Das Spiel schießt mit Geschützen nur auf Objekte: Ein Klick auf die leere Karte meldet »Ziel erforderlich«. An = ein Rechtsklick auf die Karte setzt dort ein unsichtbares Scheinziel, und die Geschütze bekämpfen es wie ein normales Ziel (es wird entfernt, wenn kein Geschütz mehr einen Befehl darauf hat). Aus = wie im Spiel. Marinegeschütze des Spielers.
help.Guns/BigGunsLocalSolution = Ein Geschütz mit zerstörtem oder ausgeschaltetem Direktor behält im Spiel für immer die Feuerlösung 0 (es folgt nur dem besten funktionierenden Sensor) und schießt mit dem vollen Fehler der lokalen Kontrolle. Große Türme haben lokale Kontrolle und eigene Entfernungsmesser. An = ein Schiffsgeschütz mit einer Granate über 2 kg (etwa ab 50 mm) und ohne funktionierenden Direktor baut die Feuerlösung selbst auf, wie ein Geschütz ohne Sensoren (die Zielgenauigkeit bleibt die der lokalen Kontrolle: schlechter als mit Direktor). Kleinere Geschütze bleiben wie im Spiel. Aus = wie im Spiel.
help.Guns/ClickEngagesAllGuns = Ein Rechtsklick auf einen feindlichen Kontakt bei gewähltem eigenem Schiff lässt das Spiel EINE Geschützmunition befehlen - die mit der größten Reichweite, die in dem Moment ein nutzbares Geschütz hat (ein Geschütz mit zerstörtem Direktor oder beim Nachladen zählt nicht, sein Kaliber wird übersprungen). An = jede Geschützmunition des Schiffs, die das Ziel erreicht (nur Reichweite, der Feuersektor spielt keine Rolle), erhält den Befehl. Aus = wie im Spiel. Nur Schiffe des Spielers.
help.Guns/LocalControlKeepsFiring = Ein Geschütz ohne funktionierenden Direktor (zerstört, ausgeschaltet oder keiner) zielt mit lokaler Kontrolle. Das Spiel hält dann jeden nächsten Schuss zurück, bis die vorige Granate eingeschlagen ist (Einschießen: eine Granate pro Flugzeit, 30-60 s auf große Entfernung), solange die Feuerlösung des Geschützes unter 95 % liegt; bei zerstörtem Direktor bleibt die Lösung bei 0, so dass ein solches Geschütz sehr selten schießt. An = ohne diese Wartezeit: ein Geschütz mit lokaler Kontrolle schießt mit normaler Feuerrate (die Genauigkeit bleibt schlecht, wie im Spiel). Aus = wie im Spiel. Nur Geschütze des Spielers.
help.Guns/AccuracyMultiplier = Wie genau die Granaten selbst sind: die Streuung der Granaten um den Zielpunkt wird durch diese Zahl geteilt, also 2 = halbe Streuung (doppelt so genau), 0,5 = doppelte Streuung, 1 = wie im Spiel. Werte des Autorenpakets und Ihre eigenen Werte in der Munitionstabelle unten ersetzen das Ergebnis unverändert. Gilt ab dem nächsten Missionsstart.
help.Guns/FireControlAccuracy = Wie genau Geschütze auf Überwasserziele zielen, alle Geschütze: der Zielfehler jeder Salve wird durch diese Zahl geteilt (2 = halber Fehler, 1 = wie im Spiel). Das kommt zu allem hinzu, was das Spiel schon berücksichtigt (Direktor, Licht, Besatzung, wie gut das Ziel aufgeschaltet ist). Die Streuung der Granaten selbst ist etwas anderes: siehe Granatgenauigkeit oben. Wirkt sofort.
help.Guns/WeakDirectorsLift = Welcher Anteil der Lücke zwischen einem sehr schwachen Direktor und dem schwächsten Direktor des Spiels geschlossen wird, in Prozent. Der schwächste Direktor des Spiels hat eine Genauigkeit von 0,75 (das Spiel nennt sie gain); manche Regelsätze (z. B. WW2-Pakete) haben Direktoren von 0,1-0,6, und selbst ein guter davon zielt weit schlechter als die des Spiels. Ein Direktor unter 0,75 bekommt seine Genauigkeit um diesen Anteil der Differenz zu 0,75 angehoben (50 = auf halbem Weg: 0,35 wird 0,55); seine Mindestlösung wächst um denselben Faktor. Ein besserer Direktor hat kleinere Zielfehler, baut die Feuerlösung (die Lösung % des Geschützes) schneller auf und lässt die Geschütze seltener auf Einschläge warten. Direktoren ab 0,75 bleiben unberührt. 0 = wie die Direktoren sind, 100 = alle schwachen Direktoren so gut wie der schwächste des Spiels. Wirkt sofort.
help.Guns/LocalControlGain = Genauigkeit von Geschützen ohne funktionierenden Direktor (die Geschützbesatzung zielt selbst; das Spiel nennt sie gain): je höher, desto kleiner die Zielfehler. Der eigene Wert des Spiels ist 0,6, besser als die meisten Direktoren von Regelsätzen mit schwachen Direktoren; dies ist ein Multiplikator darauf. 1 = der Wert des Spiels. Wirkt sofort.
help.Guns/SolutionBuildSpeed = Wie schnell Geschütze ihre Feuerlösung aufbauen (die Lösung % des Geschützes: wie gut das Geschütz Kurs und Fahrt des Ziels erfasst hat; eine höhere Lösung bedeutet kleinere Zielfehler durch die Zielbewegung und weniger Warten auf Einschläge). Das ist ein Multiplikator nur der Geschwindigkeit - die Genauigkeit des Direktors ändert sich nicht. Gilt für Direktoren und für Geschütze ohne Direktor. 1 = wie im Spiel; 0,3 = dreimal langsamer. Eine Kurs- oder Fahrtänderung des Ziels kostet weiterhin denselben Teil der Lösung, bei niedriger Geschwindigkeit hält ein manövrierendes Ziel die Lösung also niedrig. Wirkt sofort.
help.Guns/ManeuverSolutionLoss = Wie viel der Feuerlösung ein Geschütz bei jeder Prüfung (alle 2 s) verliert, wenn sich der Kurs des Ziels um mehr als 4 Grad und/oder die Geschwindigkeit um mehr als 4 Knoten geändert hat: dieser Prozentsatz der AKTUELLEN Lösung, einmal für den Kurs und einmal für die Geschwindigkeit. Das Spiel nimmt jeweils feste 0,1 (10 Punkte), egal wie hoch oder niedrig die Lösung ist; ein Geschütz mit niedriger Lösung kann sie gegen ein manövrierendes Ziel daher gar nicht aufbauen. 0 = die festen 0,1 des Spiels. Gilt für Direktoren und für Geschütze ohne Direktor.
help.Guns/LocalSolutionGrowth = Wie schnell ein großes Geschütz ohne funktionierenden Direktor (siehe Große Geschütze bauen ohne Direktor eine Lösung auf) seine eigene Feuerlösung aufbaut, in Prozent der Wachstumsgeschwindigkeit seines BESTEN Direktors (der stärkste seiner zugeordneten Sensoren, funktionierend oder nicht: Gain x Besatzung x Licht). Ein Geschütz ohne jeden Sensor baut sie im Spiel allein mit der Besatzungsgeschwindigkeit auf, was schneller ist als ein schwacher Direktor (Gain 0,3-0,5) und den Verlust des Direktors zum Vorteil macht. 75 = drei Viertel der Direktorgeschwindigkeit. Ein Geschütz ganz ohne zugeordneten Sensor nimmt den DURCHSCHNITTLICHEN Direktor aller Einheiten der Mission (denselben Prozentsatz davon), ist also ebenfalls nicht schneller als ein Direktor.
help.Guns/OpticalDirectorMinSolution = Mindest-Feuerlösung mit optischem Direktor: die Lösung (wie gut das Geschütz Kurs und Fahrt des Ziels erfasst hat, als Lösung % des Geschützes angezeigt, 0..1) fällt nie unter diesen Wert und beginnt bei ihm, so dass die Geschütze nach Feuereröffnung früher treffen und seltener auf Einschläge warten. Das ist ein Multiplikator des eigenen Minimums des Direktors (der Sensor-ini-Schlüssel FCMinSolution); 1 = wie der Direktor ist.
help.Guns/RadarDirectorMinSolution = Mindest-Feuerlösung mit Radar-Direktor: die Lösung (wie gut das Geschütz Kurs und Fahrt des Ziels erfasst hat, als Lösung % des Geschützes angezeigt, 0..1) fällt nie unter diesen Wert und beginnt bei ihm, so dass die Geschütze nach Feuereröffnung früher treffen und seltener auf Einschläge warten. Das ist ein Multiplikator des eigenen Minimums des Direktors (der Sensor-ini-Schlüssel FCMinSolution); 1 = wie der Direktor ist.
