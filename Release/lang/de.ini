help.Fire/UncoveredWeapons = Was eine Waffe tut, die keine Regel der Standing Orders der Einheit abdeckt (das Paar Waffenklasse × Ziel passt auf keine Regel): sie feuert ab diesem Waffenstatus automatisch. Free = nur bei „Frei“ (Standard). Tight = bei „Eingeschränkt“ und „Frei“. Hold = bei jedem Waffenstatus, auch bei „Halten“. Das Spiel selbst feuert eine solche Waffe nie automatisch. Manuelle Befehle bleiben unberührt.
