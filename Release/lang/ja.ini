ammo.more = ...ほか {0} 件: 入力して絞り込み
ammo.none = これ以上の砲弾薬はありません。
ammo.removeTip = 表から削除 (ゲームの値に戻ります)
help.Guns/RerollAimError = ゲームは各砲の照準点にランダムな射撃指揮誤差を加え、砲が発射するまで保持します。最大射程付近では、この誤差が照準点を射表の外へ押し出すことがあり、砲は解を失って旋回すらせず、誤差は発射後にしか引き直されないため一切撃ちません。隣の砲が撃つ間、砲塔が数分間遊びます。オン = そのような砲は直ちに新しい誤差を引きます (目標自体に命中させられる場合のみ)。オフ = ゲームどおり。プレイヤーの砲のみ。
help.Guns/BarrelScatter = ゲームは砲弾の散布を一斉射につき一度だけ決め、砲架のすべての砲身に与えるため、連装・三連装砲塔の砲弾は完全に平行に飛び、一列に着弾し、命中も外れも同時になります。オン = 最初の砲身以外はそれぞれ独自の散布を引きます (ゲームと同じ散布、同じ狙点の周り)。オフ = ゲームどおり。水上目標、全艦の艦砲。
help.Guns/PointFire = ゲームでは砲は物体にしか射撃できず、何もない地図をクリックすると「目標が必要」と表示されます。オン＝地図を右クリックすると、その地点に見えないおとり目標が置かれ、砲は通常の目標として攻撃します（その目標に命令を持つ砲がなくなると削除されます）。オフ＝ゲーム通り。プレイヤーの艦砲が対象です。
help.Guns/BigGunsLocalSolution = 指揮装置が破壊または停止した砲は、ゲームでは射撃諸元が永遠に0のまま (作動中の最良のセンサーに追従するだけ) で、局所管制の誤差をそのまま受けます。大型砲塔には局所管制と独自の測距儀があります。オン = 砲弾が2 kgを超える (おおよそ50 mm以上) 艦砲で作動する指揮装置がないものは、センサーのない砲と同様に射撃諸元を自分で作ります (照準ゲインは局所管制のまま: 指揮装置より劣る)。小口径砲はゲームどおり。オフ = ゲームどおり。
help.Guns/ClickEngagesAllGuns = 自艦を選択して敵コンタクトを右クリックすると、ゲームは砲弾薬を1種類だけ命令します。その時点で使える砲があるうち最長射程のものです (ディレクターが破壊された砲や装填中の砲は数えず、その口径は飛ばされます)。オン = 目標に届く艦の全砲弾薬に命令します (射程のみ、射界は問いません)。オフ = ゲームどおり。プレイヤーの艦のみ。
help.Guns/LocalControlKeepsFiring = 有効なディレクターがない砲 (破壊、停止、または無し) は局所管制で照準します。砲の射撃解が 95% 未満の間、ゲームは前の砲弾が着弾するまで次の射撃を止めます (観測射撃: 飛翔時間ごとに1発、遠距離で 30-60 秒)。ディレクターが破壊されると解は 0 のままなので、その砲はほとんど撃ちません。オン = この待ちなし: 局所管制の砲も通常の発射速度で撃ちます (精度はゲームどおり悪いまま)。オフ = ゲームどおり。プレイヤーの砲のみ。
help.Guns/AccuracyMultiplier = 砲弾そのものの精度: 照準点まわりの砲弾の散布をこの数で割ります。2 = 散布が半分 (2倍正確)、0.5 = 散布が2倍、1 = ゲームどおり。作者パックの値と下の弾薬表のご自身の値は、結果をそのまま置き換えます。次のミッション開始から有効。
help.Guns/FireControlAccuracy = 水上目標への砲の照準精度 (全砲): 各斉射の照準誤差をこの数で割ります (2 = 誤差が半分、1 = ゲームどおり)。ゲームが既に考慮するもの (ディレクター、光、乗員、捕捉の度合い) に上乗せされます。砲弾そのものの散布は別物で、上の砲弾の精度を参照してください。即時有効。
help.Guns/WeakDirectorsLift = 非常に弱いディレクターとゲーム最弱のディレクターとの差を、何パーセント埋めるか。ゲーム最弱のディレクターの精度は 0.75 (ゲームでは gain)。一部のルールセット (WW2 パックなど) には 0.1-0.6 のディレクターがあり、その良いものでもゲーム本来よりはるかに照準が劣ります。0.75 未満のディレクターは、0.75 との差のこの割合だけ精度が引き上げられます (50 = 中間: 0.35 が 0.55 に)。最小解も同じ倍率で増えます。優れたディレクターは照準誤差が小さく、射撃解 (砲の解 %) の構築が速く、砲が着弾待ちをする機会も減ります。0.75 以上のディレクターは変わりません。0 = そのまま、100 = 弱いディレクターすべてがゲーム最弱と同等。即時有効。
help.Guns/LocalControlGain = 有効なディレクターがない砲 (砲員が自分で照準。ゲームでは gain) の精度: 高いほど照準誤差が小さくなります。ゲーム自身の値は 0.6 で、弱いディレクターのルールセットの大半のディレクターより優れています。これはその値への倍率です。1 = ゲームの値。即時有効。
help.Guns/SolutionBuildSpeed = 砲が射撃解 (砲の解 %: 目標の針路と速力をどれだけ捉えたか。解が高いほど目標運動による照準誤差が小さく、着弾待ちも減る) を構築する速さ。速度だけの倍率で、ディレクターの精度は変わりません。ディレクターにもディレクターなしの砲にも適用されます。1 = ゲームどおり、0.3 = 3倍遅い。目標の変針や速力変更が解に与える損失は同じなので、低速では機動する目標が解を低く保ちます。即時有効。
help.Guns/ManeuverSolutionLoss = 目標の針路が4度を超えて、または速力が4ノットを超えて変わったとき、砲が各判定 (2秒ごと) で失う射撃諸元の量: 現在の射撃諸元のこの割合を、針路と速力でそれぞれ1回ずつ。ゲームは諸元の高低に関係なく固定の0.1 (10ポイント) ずつ引くため、諸元の低い砲は機動する目標に対して全く諸元を伸ばせません。0 = ゲームの固定0.1。指揮装置にも指揮装置なしの砲にも適用されます。
help.Guns/LocalSolutionGrowth = 作動する指揮装置を持たない大型砲 (「大口径砲は指揮装置なしで射撃諸元を作る」参照) が自前の射撃諸元を作る速さを、その砲の最良の指揮装置 (関連センサーのうち最強のもの、作動の有無を問わない: ゲイン x 乗員 x 照明) の成長速度に対する割合で指定します。ゲームではセンサーのない砲は乗員の速度だけで構築し、これは弱い指揮装置 (ゲイン0.3-0.5) より速いため、指揮装置の喪失が有利になってしまいます。75 = 指揮装置の速度の4分の3。関連センサーがまったくない砲は、ミッション内の全ユニットの平均的な指揮装置 (同じ割合) を基準にするため、指揮装置より速くなることはありません。
help.Guns/OpticalDirectorMinSolution = 光学ディレクター使用時の最小射撃解: 解 (砲が目標の針路と速力をどれだけ捉えたか、砲の解 % として表示、0..1) はこの水準を下回らず、この水準から始まるため、砲は射撃開始後に早く命中し、着弾待ちも減ります。ディレクター自身の最小値 (センサー ini キー FCMinSolution) への倍率です。1 = ディレクターのまま。
help.Guns/RadarDirectorMinSolution = レーダー・ディレクター使用時の最小射撃解: 解 (砲が目標の針路と速力をどれだけ捉えたか、砲の解 % として表示、0..1) はこの水準を下回らず、この水準から始まるため、砲は射撃開始後に早く命中し、着弾待ちも減ります。ディレクター自身の最小値 (センサー ini キー FCMinSolution) への倍率です。1 = ディレクターのまま。
