help.UI/ClickVolume = タブのボタンとスイッチのクリック音量、0..1（0 = 無音；ゲーム本来のボタンは鳴りません）。
help.FireControl/GunOneDirector = 射撃を開始した砲は、ゲームのようにすべてではなく、ディレクター1台（すでに目標を追跡中のもの、または最適な空きのもの）で目標チャンネルを使います - 他のディレクターは、他の砲や同じディレクターを共有するミサイルのために空いたままになります（例：アデレードの Mk92 + STIR、スヴェルドロフの Top Bow + Four Eyes）。
help.FireControl/GunChannelLimit = ディレクターに目標用の空きチャンネルがない砲は、チャンネルが空くまでローカル管制で照準します（有効なディレクターがないときのゲームのペナルティ：解算ゲイン低下、暗闇で誤差増大）。オフ = ゲームどおり：そのディレクターが何個の目標を追跡していても、最良の有効なディレクターで照準します。
help.UI/SamReadyButton = 発射前にウォームアップが必要な発射機（SAM）の行に準備ボタンを表示：クリック = 今すぐミサイルを装填、もう一度クリック = 格納。
help.UI/SamReadyMinutes = ボタン操作後、使われない場合に発射機が準備状態を保つ分数：その後ミサイルは格納されます。
help.Ships/SamAutoCharge = ユニット（敵も）は、未確認航空機が下の距離より近づくと SAM 発射機を装填します（ミサイルをレールへ）。乗員がすでに処理した（ゲームの OODA ループ）コンタクトのみが対象です。オフ = ゲーム本来のウォームアップ（敵目標が判明すると開始）。
help.Ships/SamKeepLoaded = 装填済み（ホット）の発射機は、発射後もミサイルをレール上に保持：ゲームは発射機がしばらく待機すると弾薬庫へ戻します（最初の発射後に2発目が「消える」）。オフ = ゲームどおり。
help.Ships/SamAnimFix = 弾薬ファイルに発射機の正確なシステム名での位置データがなくても、装填・格納時にミサイルが動きます（甲板の下から上へ / 下へ）（例：SA-N-1 弾薬を使う SA-N-1A）：最も近い一致エントリを使用します。
help.Ships/SamAutoChargeRange = 接近する未確認航空機が SAM 発射機の装填を引き起こす距離（海里）。
help.Ships/NoRbuSurfaceChase = 対潜迫撃砲（RBU）で水上目標を攻撃する艦は、迫撃砲の射程に入るために追跡しません - 針路を保ち、目標が射程に入ったら射撃します。すべての艦（敵も）。
help.Ships/NoAirChase = 艦は、航空機やミサイルを兵装の射程に入れるために追跡しません - 針路を保ち、射程に入ったら射撃します。すべての艦（敵も）。
help.UI/WeaponsTabGroundUnits = 地上車両と陸上施設（独自の砲 / 発射機を持つユニット）の兵装タブ。
help.UI/WeaponsTabAircraft = 航空機とヘリコプターの兵装タブ（ハードポイント上の兵器：1グループ、弾薬の種類ごとの射撃、目標の種類ごとのスイッチ）。
help.UI/FireShowsZones = 射撃後に目標を選択している間、兵器の射界と射程をマップと3Dに表示します（ユニットのステータス行で兵器にAltを押したままカーソルを合わせたときのゲームの動作と同じ）。
help.Optics/BinocularsNormalView = 最大倍率の双眼鏡を通常視界で開始します（ゲームは夜間 / サーマルフィルター付きで開始）。ゲームのフィルターキーでフィルターが入ります。
help.Optics/NormalViewDayOnly = 通常視界は昼間のみ既定になります；夜間はゲーム本来の既定フィルターのままです。
help.Effects/FireFlicker = 艦上の火災の光がちらつきます。火災が強いほど深く速く（小 / 中 / 大）。
help.Effects/FireLightPower = 艦上の火災の光の明るさ（ゲーム本来の火災の光を倍率調整；範囲も拡大）。1 = ゲームどおり。
help.Effects/MuzzleFlashLight = 砲、CIWS、機関砲の発射時に砲口で短い閃光（夜間に見えます）。
help.Effects/MissileLaunchFlashLight = 発射後、ブースターが燃えている間ミサイルに光が付きます（ミサイルのブースター燃焼時間）。
help.Effects/HitFlashLight = 砲弾が命中した場所での短い閃光（水中は除く）。
help.Effects/FlashPower = 閃光の明るさとサイズ、1 = 既定。
help.Guns/AimBeyondMaxRange = プレイヤーの砲、CIWS、機関砲は、最大射程外の目標（射程の最大1.5倍、最低5海里）に向けて、射撃せずに旋回・仰角を取ります。最大射程にあるかのように。オフ = ゲームどおり：目標が射程に入るまで砲塔は動きません。
help.Guns/MaxAccuracyMeters = 水上目標に対する砲の最良（最大）精度（メートル）：火器管制の距離誤差の下限。ゲームは約40 mを使うため、近距離（約1.4海里まで）では中距離より砲が相対的に不正確です。距離によるスケーリング（射程の1.5 %）は維持されます。ゲームの挙動にするには約40を設定。
help.Guns/MachineGunBurstFix = 機関砲は発射のたびに砲口の閃光を表示：まだ再生中のプール済み閃光エフェクトを再起動します。
help.Guns/MachineGunSoundLoopFix = 機関砲のループ発射音は、クリップの無音部分（長い連射の途中の隙間）をスキップします。
help.Guns/HitSoundFix = 砲の命中は常に爆発音を再生：音が開始しなかったエフェクト（プール済みインスタンス）を強制再生させます。
help.General/Debug = 詳細なログと BepInEx/AlternativeWeaponsControl.trace.txt。
help.General/Language = Mod のテキストの言語：ゲーム言語のコード（en, ru ...）；空 = ゲーム自身の言語。テキストは Mod フォルダ内の lang/<コード>.ini にあります - 編集して翻訳できます。
help.Fire/UnknownAirMinKnots = 速度（kn）。これより速く艦に向かって接近する（50 nm 以内）未識別機を Weapons タブの「On Free」スイッチが攻撃します。ゲーム内の旅客機は巡航約 460-480 kn、最大 560 kn です。
help.Fire/UnknownAirMaxNm = 距離（nm）。この範囲内で艦に向かう高速の未識別機を Weapons タブの「On Free」スイッチが攻撃します。
help.Fire/UnknownAirDefaultOwn = 自軍と同盟の艦に対する Weapons タブ「On Free」スイッチの初期状態（ユニットで変えた値はそのユニットと共に保存されます）。
help.Fire/UnknownAirDefaultEnemy = 敵 AI の艦に対する同じ設定（敵 AI が自らこの種の航空機を攻撃します）。
help.Fire/EngageByPlotRelation = ゲームのAIは、接触がプロット上で敵対であり、かつ真の陣営も敵対である場合にのみ目標とします。真の陣営はプレイヤーが知り得ないため、プレイヤーが敵対とマークした接触（例：中立の旅客機）は、Free の自艦に攻撃されることがありません。オン：自艦はプロットのみに従い、敵対とマークした接触を攻撃し、真の陣営は無視します（チートなし）。オフ = ゲーム本来の動作。
