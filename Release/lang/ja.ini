preset.note = 下のディレクター設定を入力します (砲弾の精度は含みません)。基本: ゲームそのまま。拡張: 弱いディレクターをより正確に、ディレクターなしの砲はやや悪く - ゲーム本来や弱いディレクターのルールセットに向きます。WW2 Mod: WW2 パック (弱いディレクター) 向け: 弱いディレクターをゲーム最弱のディレクターとの差の10分の1だけ引き上げ、ディレクターなしの砲はディレクターより悪く、射撃解の構築は半分の速さ。保存するには適用してください。
