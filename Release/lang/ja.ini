ammo.note = 精度: 半数必中界 (CEP)、最大射程で砲弾が着弾する半径 (メートル、小さいほど正確)。威力: 弾頭の威力。ゲームの値は欄の横に表示され、矢印で戻せます。✕ で表の行を削除し、表の下のリストでゲームの他の砲弾薬を追加できます。適用後に読み込まれる弾薬 (ミッション開始) に反映されます。
