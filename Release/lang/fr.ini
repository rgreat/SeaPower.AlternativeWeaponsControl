ammo.note = Précision : erreur circulaire probable, le rayon en mètres à portée maximale dans lequel tombent les obus (plus petit = plus précis). Puissance : puissance de la charge. Les valeurs du jeu sont affichées à côté des champs ; la flèche les rétablit. ✕ retire une ligne du tableau et la liste sous le tableau ajoute toute autre munition de canon du jeu. S'applique aux munitions chargées après Appliquer (début de mission).
