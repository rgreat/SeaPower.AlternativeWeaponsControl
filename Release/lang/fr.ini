help.UI/ClickVolume = Volume du clic des boutons et interrupteurs de l'onglet, 0..1 (0 = sans son ; les boutons du jeu n'en font pas).
help.FireControl/GunOneDirector = Un canon qui ouvre le feu prend un canal de cible sur UN de ses directeurs (celui qui piste déjà sa cible, ou le meilleur libre), et non sur tous comme dans le jeu - les autres directeurs restent libres pour d'autres canons et pour les missiles qui les partagent (p. ex. Mk92 + STIR sur l'Adelaide, Top Bow + Four Eyes sur le Sverdlov).
help.FireControl/GunChannelLimit = Un canon dont les directeurs n'ont aucun canal de cible libre pour sa cible vise en contrôle local (la pénalité du jeu quand aucun directeur ne fonctionne : gain de solution réduit, erreur plus grande dans l'obscurité) jusqu'à ce qu'un canal se libère. Désactivé = comme dans le jeu : un canon vise avec son meilleur directeur opérationnel, même si celui-ci piste déjà beaucoup de cibles.
help.UI/SamReadyButton = Un bouton de disponibilité sur les lignes des lanceurs qui chauffent avant de tirer (SAM) : clic = charger les missiles maintenant, nouveau clic = les rentrer.
help.UI/SamReadyMinutes = Minutes pendant lesquelles le lanceur reste prêt après le bouton, s'il n'est pas utilisé : ensuite les missiles sont rentrés.
help.Ships/SamAutoCharge = Les unités (ennemies aussi) chargent leurs lanceurs SAM (missiles sur les rails) quand un aéronef inconnu s'approche à moins de la distance ci-dessous. Seuls comptent les contacts déjà traités par l'équipage (boucle OODA du jeu). Désactivé = la chauffe propre du jeu, qui démarre quand une cible hostile est connue.
help.Ships/SamKeepLoaded = Un lanceur chargé (chaud) garde les missiles sur ses rails après un tir : le jeu les décharge dans la soute quand le lanceur est resté inactif un moment (un deuxième missile « disparaît » après le premier tir). Désactivé = comme dans le jeu.
help.Ships/SamAnimFix = Les missiles se déplacent au chargement et au déchargement (montent depuis / descendent sous le pont) même si le fichier de munition n'a pas de données de position sous le nom exact du système du lanceur (p. ex. SA-N-1A avec une munition SA-N-1) : l'entrée la plus proche est utilisée.
help.Ships/SamAutoChargeRange = Distance (nm) d'un aéronef inconnu qui s'approche et qui fait charger les lanceurs SAM.
help.Ships/NoRbuSurfaceChase = Un navire qui attaque une cible de surface avec des lance-roquettes ASM (RBU) ne la poursuit pas pour entrer dans la portée des lance-roquettes - il garde son cap et tire quand la cible entre en portée. Tous les navires, ennemis aussi.
help.Ships/NoAirChase = Un navire ne poursuit pas les aéronefs et missiles pour les amener dans la portée de ses armes - il garde son cap et tire quand ils entrent en portée. Tous les navires, ennemis aussi.
help.UI/WeaponsTabGroundUnits = L'onglet Armement pour les véhicules terrestres et installations à terre (les unités avec leurs propres canons / lanceurs).
help.UI/WeaponsTabAircraft = L'onglet Armement pour avions et hélicoptères (leurs armes sur les points d'emport : un groupe, un Feu par type de munition, interrupteurs par type de cible).
help.UI/FireShowsZones = Pendant le choix de la cible après Feu, les secteurs de tir et la portée des armes sont affichés sur la carte et en 3D (comme le fait le jeu avec Alt maintenu sur une arme dans la ligne d'état de l'unité).
help.Guns/AimBeyondMaxRange = Les canons, CIWS et mitrailleuses du joueur se tournent et s’élèvent vers une cible au-delà de leur portée maximale (jusqu’à 1,5 x la portée, au moins 5 nm) ou hors de leur secteur de tir (autant que le secteur le permet) sans tirer. Désactivé = comme dans le jeu : la tourelle reste immobile tant que la cible n’est pas à portée et dans le secteur.
help.Guns/MaxAccuracyMeters = Meilleure (maximale) précision des canons contre les cibles de surface, en mètres : le plancher de l'erreur de distance de la conduite de tir. Le jeu utilise environ 40 m, donc à courte portée (jusqu'à ~1,4 nm) les canons sont relativement moins précis qu'à moyenne portée. La variation avec la distance (1,5 % de la portée) reste. Réglez environ 40 pour le comportement du jeu.
help.General/Debug = Journalisation détaillée et BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Langue des textes du mod : un code de langue du jeu (en, ru ...) ; vide = la langue propre du jeu. Les textes sont dans les fichiers lang/<code>.ini du dossier du mod - modifiez-les pour traduire.
help.Fire/UnknownAirMinKnots = Vitesse (nd) au-delà de laquelle un aéronef non identifié se dirigeant vers le navire (à moins de 50 nm) est engagé par l'option « On Free » de l'onglet Weapons. Les avions de ligne du jeu croisent à environ 460-480 nd, 560 au plus.
help.Fire/UnknownAirMaxNm = Distance (nm) en deçà de laquelle un aéronef rapide non identifié se dirigeant vers le navire est engagé par l'option « On Free » de l'onglet Weapons.
help.Fire/UnknownAirDefaultOwn = État initial de l'option « On Free » de l'onglet Weapons pour vos navires et ceux de vos alliés (le réglage fait sur une unité est conservé avec elle).
help.Fire/UnknownAirDefaultEnemy = Idem pour les navires IA ennemis (leur IA engage seule ces aéronefs).
help.Fire/EngageByPlotRelation = L'IA du jeu ne retient un contact comme cible que s'il est hostile sur le plot ET que son vrai camp est aussi hostile. Le vrai camp est ce que le joueur ne peut pas savoir : un contact que le joueur a marqué hostile (p. ex. un avion de ligne neutre) n'est donc jamais engagé par les navires du joueur en Free. Activé : les navires du joueur se fient au seul plot - les contacts marqués hostiles sont engagés, le vrai camp est ignoré (pas de triche). Désactivé = comme dans le jeu.
help.Guns/AmmunitionFix = La précision (erreur circulaire probable) et la puissance de la charge des munitions de canon viennent du lot de l'auteur (ammunition_fix.txt dans le dossier du mod) et des valeurs réglées dans le tableau ci-dessous. Désactivé = valeurs de munitions du jeu. S'applique aux munitions chargées après Appliquer (début de mission).
help.Guns/EngageOutsideSector = De nombreuses armes lourdes (canons de cuirassés et de croiseurs, certains CIWS) ont EngageOnlyInsideArc=True dans le jeu : on ne leur attribue jamais de cible hors de leur secteur de tir. Activé = cette restriction est ignorée ; l’arme prend une telle cible et se tourne vers le bord le plus proche de son secteur (sans tirer tant que la cible n’est pas dedans). S’applique aux unités chargées après le changement (début de mission). Fonctionne avec l’option ci-dessus.
help.Guns/RememberTargets = Un nouvel ordre de tir fait passer les canons sur la nouvelle cible comme avant, mais les cibles précédentes ne sont pas oubliées : un canon qui ne peut pas atteindre la nouvelle cible (hors de portée ou hors de son secteur de tir) continue sur la cible précédente la plus récente qu'il peut atteindre, et revient à la plus récente dès qu'il le peut. Cessez le feu vide la liste. Désactivé = comme dans le jeu : chaque nouvel ordre remplace l'ancien.
help.UI/BottomPanelFire = Un clic sur une arme du panneau en bas de l'écran agit comme le bouton Fire de l'onglet Armes : les secteurs de tir et la portée des armes s'affichent en rouge sur la carte et en 3D, et le cercle de portée rouge du jeu est masqué. Nécessite « Fire shows weapon arcs and range ».
help.UI/SectionTargetTypes = Le titre d'un groupe SAM de l'onglet Armes énumère aussi les autres types de cibles des missiles sol-air : SAM/ANTI-SHIP (un SAM pouvant aussi frapper des navires). Les autres types de cibles des missiles non SAM (ANTI-SHIP/ASW : un missile qui frappe navires et sous-marins) sont toujours indiqués.
