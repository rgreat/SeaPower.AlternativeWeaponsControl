help.Fire/UncoveredWeapons = Ce que fait une arme qu'aucune règle des Standing Orders de l'unité ne couvre (le couple classe d'arme × cible ne correspond à aucune règle) : elle tire seule à partir de ce statut d'armes. Free = seulement en « Libre » (par défaut). Tight = en « Restreint » et « Libre ». Hold = quel que soit le statut, même « Maintenir ». Le jeu lui-même ne fait jamais tirer seule une telle arme. Les ordres manuels ne sont pas concernés.
