ammo.removeTip = Retirer du tableau (les valeurs du jeu s'appliquent de nouveau)
help.Guns/RerollAimError = Le jeu ajoute au point visé de chaque pièce une erreur aléatoire de conduite de tir et la garde jusqu'à ce que la pièce ait tiré. Près de la portée maximale, cette erreur peut pousser le point visé hors de la table de tir : la pièce n'a alors plus de solution, ne tourne même pas et ne tire jamais, car l'erreur n'est retirée qu'après un coup - une tourelle reste inactive des minutes pendant que ses voisines tirent. Activé = une telle pièce reçoit aussitôt une nouvelle erreur (seulement si la cible elle-même peut être touchée). Désactivé = comme dans le jeu. Pièces du joueur uniquement.
help.Guns/BarrelScatter = Le jeu tire la dispersion des obus une seule fois par salve et la donne à tous les tubes de l'affût : les obus d'une tourelle double ou triple volent donc strictement parallèles, tombent en ligne et touchent ou ratent ensemble. Activé = chaque tube après le premier tire sa propre dispersion (la même que dans le jeu, autour du même point de visée). Désactivé = comme dans le jeu. Cibles de surface, canons navals de tous les navires.
help.Guns/PointFire = Le jeu ne tire au canon que sur des objets : un clic sur la carte vide indique « cible requise ». Activé = un clic droit sur la carte place à cet endroit un leurre invisible et les canons l'engagent comme une cible ordinaire (il est retiré quand plus aucun canon n'a d'ordre sur lui). Désactivé = comme dans le jeu. Canons navals du joueur.
help.Guns/BigGunsLocalSolution = Une pièce dont le directeur est détruit ou éteint garde pour toujours une solution de tir à 0 dans le jeu (elle ne suit que le meilleur capteur en état), donc elle tire avec toute l'erreur du contrôle local. Les grosses tourelles ont un contrôle local et leurs propres télémètres. Activé = une pièce navale dont l'obus dépasse 2 kg (environ 50 mm et plus) et sans directeur en état établit elle-même sa solution, comme une pièce sans capteurs (son gain de pointage reste celui du contrôle local : moins bon qu'avec un directeur). Les petits calibres restent comme dans le jeu. Désactivé = comme dans le jeu.
help.Guns/ClickEngagesAllGuns = Un clic droit sur un contact hostile avec un navire à soi sélectionné fait ordonner par le jeu UNE munition de canon - celle de plus longue portée qui a à cet instant une pièce utilisable (une pièce dont le directeur est détruit ou qui recharge ne compte pas, son calibre est sauté). Activé = chaque munition de canon du navire qui atteint la cible (portée seulement, le secteur de tir n'importe pas) reçoit l'ordre. Désactivé = comme dans le jeu. Navires du joueur uniquement.
help.Guns/LocalControlKeepsFiring = Une pièce sans directeur en état (détruit, éteint ou absent) pointe en contrôle local. Le jeu retient alors chaque coup suivant jusqu'à la chute de l'obus précédent (tir de réglage : un obus par temps de vol, 30-60 s à longue distance) tant que la solution de la pièce est sous 95 % ; directeur détruit, la solution reste à 0, si bien qu'une telle pièce tire très rarement. Activé = sans cette attente : une pièce en contrôle local tire à sa cadence normale (sa précision reste mauvaise, comme dans le jeu). Désactivé = comme dans le jeu. Pièces du joueur uniquement.
help.Guns/AccuracyMultiplier = Précision des obus eux-mêmes : la dispersion des obus autour du point visé est divisée par ce nombre, donc 2 = moitié moins de dispersion (deux fois plus précis), 0,5 = deux fois plus de dispersion, 1 = comme dans le jeu. Les valeurs du pack de l'auteur et vos propres valeurs dans le tableau des munitions ci-dessous remplacent le résultat telles quelles. Effet dès le prochain début de mission.
help.Guns/FireControlAccuracy = Précision avec laquelle les pièces pointent sur les cibles de surface, toutes les pièces : l'erreur de pointage de chaque salve est divisée par ce nombre (2 = moitié d'erreur, 1 = comme dans le jeu). Elle s'ajoute à tout ce que le jeu compte déjà (directeur, lumière, équipage, qualité de l'accrochage). La dispersion des obus eux-mêmes est autre chose : voir la précision des obus ci-dessus. Effet immédiat.
help.Guns/WeakDirectorsLift = Quelle part de l'écart entre un directeur très faible et le directeur le plus faible du jeu est comblée, en pourcentage. Le directeur le plus faible du jeu a une précision de 0,75 (le jeu l'appelle gain) ; certains jeux de règles (p. ex. packs WW2) ont des directeurs de 0,1-0,6, et même un bon d'entre eux pointe bien plus mal que ceux du jeu. Un directeur sous 0,75 voit sa précision relevée de cette part de la différence jusqu'à 0,75 (50 = à mi-chemin : 0,35 devient 0,55) ; sa solution minimale croît du même facteur. Un meilleur directeur a de plus petites erreurs de pointage, établit la solution de tir (la Solution % de la pièce) plus vite et fait moins attendre les gerbes. Les directeurs de 0,75 et plus ne sont pas touchés. 0 = comme sont les directeurs, 100 = tous les directeurs faibles aussi bons que le plus faible du jeu. Effet immédiat.
help.Guns/LocalControlGain = Précision des pièces sans directeur en état (le personnel pointe lui-même ; le jeu l'appelle gain) : plus elle est haute, plus les erreurs de pointage sont petites. La valeur propre du jeu est 0,6, meilleure que la plupart des directeurs de jeux de règles à directeurs faibles ; ceci est un multiplicateur de cette valeur. 1 = la valeur du jeu. Effet immédiat.
help.Guns/SolutionBuildSpeed = Vitesse à laquelle les pièces établissent leur solution de tir (la Solution % de la pièce : à quel point la pièce a accroché cap et vitesse de la cible ; une solution plus haute donne de plus petites erreurs dues au mouvement de la cible et moins d'attentes des gerbes). C'est un multiplicateur de la seule vitesse - la précision du directeur ne change pas. Il s'applique aux directeurs et aux pièces sans directeur. 1 = comme dans le jeu ; 0,3 = trois fois plus lent. Un virage ou un changement de vitesse de la cible coûte toujours la même part de la solution, donc à faible vitesse une cible qui manœuvre garde la solution basse. Effet immédiat.
help.Guns/ManeuverSolutionLoss = Part de la solution de tir qu'une pièce perd à chaque vérification (toutes les 2 s) quand le cap de la cible a changé de plus de 4 degrés et/ou sa vitesse de plus de 4 nœuds : ce pourcentage de la solution ACTUELLE, une fois pour le cap et une fois pour la vitesse. Le jeu retire 0,1 fixe (10 points) à chaque fois, quelle que soit la solution, donc une pièce à faible solution ne peut pas la faire croître contre une cible qui manœuvre. 0 = les 0,1 fixes du jeu. Vaut pour les directeurs et les pièces sans directeur.
help.Guns/LocalSolutionGrowth = Vitesse à laquelle une grosse pièce sans directeur en état (voir Les grosses pièces établissent une solution sans directeur) construit sa propre solution de tir, en pourcentage de la vitesse de croissance de son MEILLEUR directeur (le plus fort de ses capteurs associés, en état ou non : gain x équipage x lumière). La pièce du jeu sans aucun capteur la construit à la seule vitesse de l'équipage, plus rapide qu'un directeur faible (gain 0,3-0,5), ce qui fait de la perte du directeur un avantage. 75 = trois quarts de la vitesse du directeur. Une pièce sans aucun capteur associé prend le directeur MOYEN de toutes les unités de la mission (le même pourcentage), donc elle n'est pas non plus plus rapide qu'un directeur.
help.Guns/OpticalDirectorMinSolution = Solution de tir minimale avec un directeur optique : la solution (à quel point la pièce a accroché cap et vitesse de la cible, affichée en Solution % de la pièce, 0..1) ne tombe jamais sous ce niveau et part de lui, si bien que les pièces touchent plus tôt après l'ouverture du feu et attendent moins les gerbes. C'est un multiplicateur du minimum propre du directeur (la clé ini du capteur FCMinSolution) ; 1 = comme est le directeur.
help.Guns/RadarDirectorMinSolution = Solution de tir minimale avec un directeur radar : la solution (à quel point la pièce a accroché cap et vitesse de la cible, affichée en Solution % de la pièce, 0..1) ne tombe jamais sous ce niveau et part de lui, si bien que les pièces touchent plus tôt après l'ouverture du feu et attendent moins les gerbes. C'est un multiplicateur du minimum propre du directeur (la clé ini du capteur FCMinSolution) ; 1 = comme est le directeur.
