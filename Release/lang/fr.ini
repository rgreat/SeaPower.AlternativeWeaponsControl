preset.note = Remplit les réglages de directeurs ci-dessous (pas la précision des obus). Base : le jeu tel quel. Avancé : directeurs faibles plus précis, pièces sans directeur un peu moins bonnes - convient au jeu et aux jeux de règles à directeurs faibles. WW2 Mod : pour le pack WW2 (directeurs faibles) : directeurs faibles relevés d'un dixième du chemin vers le directeur le plus faible du jeu, pièces sans directeur moins bonnes que les directeurs, solution de tir établie à demi-vitesse. Appliquer pour conserver.
