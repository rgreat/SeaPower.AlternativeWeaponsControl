help.UI/ClickVolume = 标签页按钮和开关的点击音量，0..1（0 = 无声；游戏自带按钮没有声音）。
help.FireControl/GunOneDirector = 开火的火炮只占用其中一个指挥仪（已在跟踪其目标的，或最佳的空闲者）上的目标通道，而不是像游戏那样占用全部 - 这样其他指挥仪可以留给其他火炮以及共用它们的导弹（例如阿德莱德号上的 Mk92 + STIR，斯维尔德洛夫号上的 Top Bow + Four Eyes）。
help.FireControl/GunChannelLimit = 指挥仪都没有空闲目标通道的火炮，使用本地控制瞄准（所有指挥仪都不工作时游戏的惩罚：解算增益降低，黑暗中误差增大），直到通道空出。关 = 如游戏：火炮用最佳的可用指挥仪瞄准，无论该指挥仪已跟踪多少目标。
help.UI/SamReadyButton = 在发射前需要预热的发射装置（防空导弹）行上显示就绪按钮：点击 = 立即装填导弹，再次点击 = 收起。
help.UI/SamReadyMinutes = 按下按钮后若未使用，发射装置保持就绪的分钟数：之后导弹被收起。
help.Ships/SamAutoCharge = 单位（包括敌方）在未知飞机接近到低于下方距离时装填其防空导弹发射装置（导弹上导轨）。只有乘员已处理过的接触（游戏的 OODA 循环）才计入。关 = 游戏自身的预热，在得知敌方目标时开始。
help.Ships/SamKeepLoaded = 已装填（热状态）的发射装置在发射后将导弹保留在导轨上：游戏会在发射装置闲置一段时间后将其卸入弹药库（第一发后第二枚导弹“消失”）。关 = 如游戏。
help.Ships/SamAnimFix = 即使弹药文件中没有发射装置确切系统名称下的位置数据（例如使用 SA-N-1 弹药的 SA-N-1A），导弹在装填和收起时也会移动（从甲板下升起 / 降到甲板下）：使用最接近的匹配条目。
help.Ships/SamAutoChargeRange = 接近的未知飞机触发防空导弹发射装置装填的距离（海里）。
help.Ships/NoRbuSurfaceChase = 用反潜火箭炮（RBU）攻击水面目标的舰艇不会为进入火箭炮射程而追击 - 它保持航向，目标进入射程后开火。所有舰艇，包括敌方。
help.Ships/NoAirChase = 舰艇不会为使飞机和导弹进入其武器射程而追击 - 它保持航向，在它们进入射程后开火。所有舰艇，包括敌方。
help.UI/WeaponsTabGroundUnits = 地面车辆和陆上设施（拥有自己火炮 / 发射装置的单位）的武器标签页。
help.UI/WeaponsTabAircraft = 飞机和直升机的武器标签页（挂点上的武器：一组，每种弹药一个开火，按目标类型开关）。
help.UI/FireShowsZones = 开火后选择目标期间，武器的射界和射程会显示在地图和 3D 中（如同游戏在单位状态行中按住 Alt 悬停于武器上的做法）。
help.Guns/AimBeyondMaxRange = 玩家的火炮、近防炮和机枪会转向并抬高指向超出最大射程（最远1.5倍射程，至少5海里）或射界之外的目标（在射界允许范围内），但不开火。关闭＝与游戏一致：目标进入射程和射界之前炮塔保持不动。
help.Guns/MaxAccuracyMeters = 火炮对水面目标的最佳（最高）精度，单位米：火控距离误差的下限。游戏使用约 40 米，因此近距离（约 1.4 海里内）火炮相对中距离更不精确。随距离缩放（射程的 1.5 %）保持不变。设为约 40 即游戏行为。
help.General/Debug = 详细日志和 BepInEx/AlternativeWeaponsControl.trace.txt。
help.General/Language = 模组文本的语言：游戏语言的代码（en, ru ...）；空 = 游戏自身的语言。文本位于模组文件夹中的 lang/<代码>.ini 文件里 - 编辑即可翻译。
help.Fire/UnknownAirMinKnots = 速度（节），超过该值且朝本舰飞来（50 nm 以内）的未识别飞机会被 Weapons 页的“On Free”开关攻击。游戏中的客机巡航约 460-480 节，最高 560 节。
help.Fire/UnknownAirMaxNm = 距离（nm），在此范围内朝本舰飞来的高速未识别飞机会被 Weapons 页的“On Free”开关攻击。
help.Fire/UnknownAirDefaultOwn = Weapons 页“On Free”开关对己方和盟军舰船的初始状态（在单位上设定的值随该单位保存）。
help.Fire/UnknownAirDefaultEnemy = 对敌方 AI 舰船的同一设置（其 AI 会自行攻击此类飞机）。
help.Fire/EngageByPlotRelation = 游戏的 AI 只有在目标于态势图上为敌方且其真实阵营也为敌方时才将其作为目标。真实阵营是玩家无法知道的，因此玩家标记为敌方的目标（如中立客机）永远不会被 Free 模式下的己方舰艇攻击。开：己方舰艇只依据态势图——被标记为敌方的目标会被攻击，真实阵营被忽略（不作弊）。关 = 游戏原有行为。
help.Fire/SamTightNezOnly = “限制”时，己方舰艇防空导弹的自动射击不再在最大射程开火，而是等到飞机进入导弹的不可逃脱区（飞机无法摆脱导弹的距离，与游戏在地图和提示中的计算一致）。玩家的命令和“自由”不受影响。关闭 = 游戏默认。
help.Guns/AmmunitionFix = 火炮弹药的精度 (圆概率误差) 和战斗部威力取自作者包 (模组文件夹中的 ammunition_fix.txt) 以及您在下方表中设置的值；可在表中添加游戏中的任何火炮弹药或移除一行。关 = 游戏自身的弹药值。对应用后载入的弹药 (任务开始) 生效。
help.Guns/EngageOutsideSector = 许多大型武器（战列舰和巡洋舰火炮、部分近防炮）在游戏中设有 EngageOnlyInsideArc=True：永远不会被分配射界之外的目标。开启＝忽略此限制；武器会接受这类目标并转向射界最近的边缘（目标进入射界前不开火）。对更改后加载的单位生效（任务开始）。与上面的选项配合使用。
help.Guns/RememberTargets = 新的开火命令仍会让火炮转向新目标,但先前的目标不会被遗忘:够不到新目标(超出射程或射界)的火炮会继续攻击它能够到的最新的先前目标,并在能够时回到最新目标。停火会清空列表。关闭=游戏原样:每个新命令取代旧命令。
help.UI/BottomPanelFire = 点击屏幕底部面板上的武器,效果与武器标签页的Fire按钮相同:武器的射界和射程在地图和3D中以红色显示,游戏自带的红色射程圈被隐藏。需要开启“Fire shows weapon arcs and range”。
help.UI/SectionTargetTypes = 武器标签页中SAM分组的标题还会列出防空导弹的其他目标类型(SAM/ANTI-SHIP:也能攻击舰船的防空导弹)。非SAM导弹的其他目标类型(ANTI-SHIP/ASW:可攻击舰船和潜艇的导弹)始终列出。
