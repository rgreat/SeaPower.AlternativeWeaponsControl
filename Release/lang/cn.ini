preset.ww2 = WW2 Mod
preset.custom = 自定义值
preset.note = 填入下方的指挥仪设置 (不含炮弹精度)。基础: 游戏原样。进阶: 弱指挥仪更精确，无指挥仪的火炮略差 - 适合游戏本身及指挥仪较弱的规则集。WW2 Mod: 适用于 WW2 包 (弱指挥仪): 弱指挥仪提升与游戏最弱指挥仪差距的十分之一，无指挥仪的火炮比指挥仪差，射击诸元以一半速度建立。应用后保存。
ammo.add = 添加弹药:
ammo.more = ...另有 {0} 项: 输入以缩小列表
ammo.none = 没有更多火炮弹药。
ammo.removeTip = 从表中移除 (恢复游戏的值)
help.Guns/RerollAimError = 游戏会给每门火炮的瞄准点加上随机的火控误差，并保持到火炮开火为止。接近最大射程时，该误差可能把瞄准点推出射表范围: 火炮于是没有解算，甚至不会转向，也永远不开火，因为误差只在射击后才重新抽取 - 邻近火炮射击时，炮塔会闲置数分钟。开 = 这样的火炮立即抽取新误差 (仅当目标本身可被命中)。关 = 与游戏一致。仅限玩家的火炮。
help.Guns/BarrelScatter = 游戏每次齐射只抽取一次弹着散布，并把它交给炮架的所有炮管，因此双联或三联炮塔的炮弹完全平行飞行，排成一线落下，同时命中或同时脱靶。开 = 第一根之后的每根炮管各自抽取自己的散布 (与游戏相同的散布，围绕同一瞄准点)。关 = 与游戏一致。水面目标，所有舰艇的舰炮。
help.Guns/PointFire = 游戏中火炮只能射击物体：点击空白地图会提示“需要目标”。开启＝右键点击地图时在该点放置一个不可见的诱饵目标，火炮像对待普通目标一样攻击它（没有火炮对其下达命令时自动移除）。关闭＝与游戏一致。适用于玩家的舰炮。
help.Guns/BigGunsLocalSolution = 指挥仪被毁或关闭的火炮在游戏中射击诸元永远为0 (只跟随最好的可用传感器)，因此以完整的本地控制误差射击。大型炮塔有本地控制和自己的测距仪。开 = 炮弹重于2千克 (约50毫米及以上) 且没有可用指挥仪的舰炮自行建立射击诸元，如同没有传感器的火炮 (瞄准增益仍是本地控制的: 比指挥仪差)。小口径火炮与游戏一致。关 = 与游戏一致。
help.Guns/ClickEngagesAllGuns = 选中己方舰艇后右键点击敌方目标，游戏只会命令一种火炮弹药 - 此刻有可用火炮且射程最远的那种 (指挥仪被毁或正在装填的火炮不计入，其口径被跳过)。开 = 舰上所有能打到目标的火炮弹药都会收到命令 (只看射程，不看射界)。关 = 与游戏一致。仅限玩家的舰艇。
help.Guns/LocalControlKeepsFiring = 没有可用指挥仪 (被毁、关闭或没有) 的火炮采用本地控制瞄准。当火炮射击诸元低于 95% 时，游戏会扣住每次后续射击，直到上一发炮弹落下 (校射: 每个飞行时间一发，远距离 30-60 秒)；指挥仪被毁时诸元保持为 0，所以这样的火炮极少开火。开 = 取消这种等待: 本地控制的火炮以正常射速开火 (精度依旧很差，与游戏一致)。关 = 与游戏一致。仅限玩家的火炮。
help.Guns/AccuracyMultiplier = 炮弹本身的精度: 炮弹围绕瞄准点的散布除以该数值，因此 2 = 散布减半 (精度翻倍)，0.5 = 散布加倍，1 = 与游戏一致。作者包的值以及您在下方弹药表中的值将原样取代结果。从下次任务开始生效。
help.Guns/FireControlAccuracy = 火炮对水面目标的瞄准精度 (全部火炮): 每次齐射的瞄准误差除以该数值 (2 = 误差减半，1 = 与游戏一致)。它叠加在游戏已计入的一切之上 (指挥仪、光照、乘员、锁定程度)。炮弹本身的散布是另一回事: 见上方的炮弹精度。立即生效。
help.Guns/WeakDirectorsLift = 很弱的指挥仪与游戏最弱指挥仪之间的差距被弥补的比例 (百分比)。游戏最弱指挥仪的精度为 0.75 (游戏称之为 gain)；某些规则集 (如 WW2 包) 的指挥仪为 0.1-0.6，其中较好的也远不如游戏自带的。低于 0.75 的指挥仪，其精度按与 0.75 之差的这一比例提高 (50 = 一半: 0.35 变为 0.55)；其最小解算按同一系数增长。更好的指挥仪瞄准误差更小，建立射击诸元 (火炮的诸元 %) 更快，火炮等待弹着的情况也更少。0.75 及以上的指挥仪不受影响。0 = 保持原样，100 = 所有弱指挥仪与游戏最弱者相当。立即生效。
help.Guns/LocalControlGain = 无可用指挥仪的火炮 (炮组自行瞄准；游戏称之为 gain) 的精度: 越高，瞄准误差越小。游戏自身的值为 0.6，好于指挥仪较弱规则集中的大多数指挥仪；这是对它的倍率。1 = 游戏的值。立即生效。
help.Guns/SolutionBuildSpeed = 火炮建立射击诸元 (火炮的诸元 %: 火炮锁定目标航向和航速的程度；诸元越高，目标运动造成的瞄准误差越小，等待弹着也越少) 的速度。仅是速度的倍率 - 指挥仪的精度不变。适用于指挥仪和无指挥仪的火炮。1 = 与游戏一致；0.3 = 慢三倍。目标转向或变速仍会损失同样比例的诸元，因此速度较低时，机动目标会使诸元保持在低位。立即生效。
help.Guns/ManeuverSolutionLoss = 当目标航向变化超过4度和/或航速变化超过4节时，火炮在每次检查 (每2秒) 损失的射击诸元量: 即当前诸元的这一百分比，航向和航速各计一次。游戏则无论诸元高低都固定扣0.1 (10点)，因此诸元低的火炮根本无法对机动目标建立诸元。0 = 游戏的固定0.1。对指挥仪和无指挥仪的火炮都有效。
help.Guns/LocalSolutionGrowth = 没有可用指挥仪的大口径火炮 (参见“大口径火炮无指挥仪时自行建立射击诸元”) 自行建立射击诸元的速度，以其最佳指挥仪 (关联传感器中最强者，无论是否可用: 增益 x 乘员 x 光照) 增长速度的百分比表示。游戏中完全没有传感器的火炮仅按乘员速度建立诸元，这比弱指挥仪 (增益0.3-0.5) 更快，使失去指挥仪反而有利。75 = 指挥仪速度的四分之三。完全没有关联传感器的火炮取任务中所有单位的平均指挥仪 (同样的百分比)，因此也不会比指挥仪更快。
help.Guns/OpticalDirectorMinSolution = 光学指挥仪的最小射击诸元: 诸元 (火炮锁定目标航向和航速的程度，显示为火炮的诸元 %，0..1) 不会低于该水平且从该水平开始，因此火炮开火后更早命中，等待弹着也更少。这是对指挥仪自身最小值 (传感器 ini 键 FCMinSolution) 的倍率；1 = 保持指挥仪原样。
help.Guns/RadarDirectorMinSolution = 雷达指挥仪的最小射击诸元: 诸元 (火炮锁定目标航向和航速的程度，显示为火炮的诸元 %，0..1) 不会低于该水平且从该水平开始，因此火炮开火后更早命中，等待弹着也更少。这是对指挥仪自身最小值 (传感器 ini 键 FCMinSolution) 的倍率；1 = 保持指挥仪原样。
