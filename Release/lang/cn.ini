ammo.note = 精度: 圆概率误差，即最大射程处炮弹落点所在的半径 (米，越小越精确)。威力: 战斗部威力。游戏的值显示在输入框旁，箭头可恢复。✕ 从表中移除一行，表下方的列表可添加游戏中任何其他火炮弹药。对应用后载入的弹药 (任务开始) 生效。
