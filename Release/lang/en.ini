help.UI/ClickVolume = Volume of the click of the tab's buttons and switches, 0..1 (0 = no sound; the game's own buttons make none).
help.FireControl/GunOneDirector = A gun opening fire takes a target channel on ONE of its directors (the one already tracking its target, or the best free one), not on all of them as in the game - so the other directors stay free for other guns and for missiles sharing them (e.g. Mk92 + STIR on the Adelaide, Top Bow + Four Eyes on the Sverdlov).
help.FireControl/GunChannelLimit = A gun whose directors have no free target channel for its target aims on local control (the game's penalty when no director works: lower solution gain, larger error in the dark) until a channel frees. Off = as in the game: a gun aims with its best working director however many targets that director already tracks.
help.UI/SamReadyButton = A readiness button on the rows of launchers that warm up before firing (SAM): click = load the missiles now, click again = put them away.
help.UI/SamReadyMinutes = Minutes the launcher stays ready after the button, if it is not used: then the missiles are put away.
help.Ships/SamAutoCharge = Units (the enemy's too) charge their SAM launchers (missiles onto the rails) when an unknown aircraft comes closer than the range below. Only contacts the unit's crew has already processed (the game's OODA loop) count. Off = the game's own warm-up, which starts when a hostile target is known.
help.Ships/SamKeepLoaded = A charged (hot) launcher keeps the missiles on its rails after a launch: the game unloads them into the magazine when the launcher has been idle for a while (a second missile 'disappears' after the first shot). Off = as in the game.
help.Ships/SamAnimFix = Missiles move on load and unload (up from / down under the deck) even when the ammunition file has no position data under the launcher's exact system name (e.g. SA-N-1A with an SA-N-1 ammunition): the nearest matching entry is used.
help.Ships/SamAutoChargeRange = Distance (nm) of an approaching unknown aircraft that charges the SAM launchers.
help.Ships/NoRbuSurfaceChase = A ship attacking a surface target with ASW mortars (RBU) does not run after it to get into the mortars' range - it keeps its course and fires once the target comes into range. All ships, the enemy's too.
help.Ships/NoAirChase = A ship does not run after aircraft and missiles to get them into the range of its weapons - it keeps its course and fires once they come into range. All ships, the enemy's too.
help.UI/WeaponsTabGroundUnits = The Weapons tab for ground vehicles and land installations (the units with guns / launchers of their own).
help.UI/WeaponsTabAircraft = The Weapons tab for aircraft and helicopters (their weapons on the hardpoints: one group, a Fire for each ammunition type, switches by target type).
help.UI/FireShowsZones = While the target is being picked after Fire, the firing arcs and range of the weapons are shown on the map and in 3D (as the game does with Alt held over a weapon in the unit's status line).
help.Guns/AimBeyondMaxRange = The player's guns, CIWS and machine guns turn and elevate towards a target beyond their maximum range (up to 1.5 x the range, at least 5 nm) or outside their firing sector (as far as the sector allows) without firing. Off = as in the game: the turret stays still until the target is in range and in the sector.
help.Guns/MaxAccuracyMeters = Best (maximum) accuracy of guns against surface targets, in metres: the floor of the fire-control range error. The game uses about 40 m, so at close range (up to ~1.4 nm) guns are relatively less accurate than at medium range. The scaling with distance (1.5 % of range) stays. Set about 40 for the game's behaviour.
help.General/Debug = Verbose logging and BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Language of the mod's texts: a code of a game language (en, ru ...); empty = the game's own language. The texts are in the files lang/<code>.ini in the mod folder - edit them to translate.
help.Fire/UnknownAirMinKnots = Speed (knots) above which an unidentified aircraft coming towards the ship (closer than 50 nm) is engaged by the Weapons tab's "On Free: engage unidentified aircraft". Airliners of the game cruise at about 460-480 knots and reach 560 at most.
help.Fire/UnknownAirMaxNm = Distance (nm) within which an unidentified fast aircraft coming towards the ship is engaged by the Weapons tab's "On Free: engage unidentified aircraft".
help.Fire/UnknownAirDefaultOwn = The starting state of the Weapons tab's "On Free: engage unidentified aircraft" for your ships and your allies' ships (a switch set on a unit is kept with it).
help.Fire/UnknownAirDefaultEnemy = The same for the enemy's AI ships (their AI engages such aircraft by itself).
help.Fire/EngageByPlotRelation = The game's AI takes a contact for a target only if it is hostile on the plot AND its true side is hostile too. The true side is what the player cannot know, so a contact the player marked hostile (e.g. a neutral airliner) is never engaged by the player's ships on Free. On: the player's ships go by the plot only - the contacts marked hostile are engaged, the true side is ignored (no cheating). Off = as in the game.
help.Fire/SamTightNezOnly = On Weapons Tight, the automatic fire of your ships' surface-to-air missiles waits until an aircraft is inside the missile's no-escape zone (the distance within which the aircraft cannot get away from it, as the game counts it for the map and the tooltip), instead of firing at the maximum range. Orders given by the player and Weapons Free are not affected. Off = as in the game.
help.Guns/AmmunitionFix = Accuracy (circular error probable) and warhead power of gun ammunition are taken from the author's pack (ammunition_fix.txt in the mod folder) and from the values you set in the table below; any other gun ammunition of the game can be added to the table, or a row removed. Off = the game's own ammunition values. Applied to ammunition loaded after Apply (a mission start).
help.Guns/EngageOutsideSector = Many big weapons (battleship and cruiser guns, some CIWS) have EngageOnlyInsideArc=True in the game: they are never given a target outside their firing sector. On = this restriction is ignored; the weapon takes such a target and turns to the nearest edge of its sector (and does not fire until the target is inside). Applied to units loaded after the change (a mission start). Works together with the option above.
help.Guns/RememberTargets = A new order to fire makes the guns switch to the new target as before, but the earlier targets are not forgotten: a gun that cannot reach the new target (out of range or outside its firing sector) goes on with the newest earlier target it can reach, and returns to the newest one when it can. Cease fire clears the list. Off = as in the game: every new order replaces the old one.
help.UI/BottomPanelFire = A click on a weapon of the panel at the bottom of the screen works like the Fire button of the Weapons tab: the weapons' firing arcs and range are shown in red on the map and in 3D and the game's red range circle is hidden. Needs 'Fire shows weapon arcs and range'.
help.UI/SectionTargetTypes = A SAM group's title on the Weapons tab also lists the other target types of the SAM ammunition: SAM/ANTI-SHIP (a SAM that can also hit ships). The other target types of non-SAM missiles (ANTI-SHIP/ASW: a missile that hits ships and submarines) are always listed.
