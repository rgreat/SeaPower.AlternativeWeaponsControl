preset.note = Rellena los ajustes de directores de abajo (no la precisión de los proyectiles). Base: el juego tal cual. Avanzado: directores débiles más precisos, cañones sin director algo peores - encaja con el juego y con conjuntos de reglas de directores débiles. WW2 Mod: para el paquete WW2 (directores débiles): los directores débiles suben una décima parte del camino hacia el director más débil del juego, los cañones sin director son peores que los directores y la solución de tiro se construye a la mitad de velocidad. Aplicar para guardar.
