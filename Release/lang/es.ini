help.UI/ClickVolume = Volumen del clic de los botones e interruptores de la pestaña, 0..1 (0 = sin sonido; los botones del juego no lo hacen).
help.FireControl/GunOneDirector = Un cañón que abre fuego toma un canal de objetivo en UNO de sus directores (el que ya sigue su objetivo, o el mejor libre), no en todos como en el juego - así los demás directores quedan libres para otros cañones y para misiles que los comparten (p. ej. Mk92 + STIR en el Adelaide, Top Bow + Four Eyes en el Sverdlov).
help.FireControl/GunChannelLimit = Un cañón cuyos directores no tienen canal de objetivo libre para su objetivo apunta con control local (la penalización del juego cuando ningún director funciona: menor ganancia de solución, mayor error en la oscuridad) hasta que se libere un canal. Desactivado = como en el juego: un cañón apunta con su mejor director operativo por muchos objetivos que ese director ya siga.
help.UI/SamReadyButton = Un botón de disponibilidad en las filas de lanzadores que se calientan antes de disparar (SAM): clic = cargar los misiles ahora, otro clic = guardarlos.
help.UI/SamReadyMinutes = Minutos que el lanzador permanece listo tras pulsar el botón, si no se usa: después los misiles se guardan.
help.Ships/SamAutoCharge = Las unidades (también las enemigas) cargan sus lanzadores SAM (misiles en los rieles) cuando una aeronave desconocida se acerca más que la distancia indicada abajo. Solo cuentan los contactos ya procesados por la tripulación (bucle OODA del juego). Desactivado = el calentamiento propio del juego, que empieza cuando se conoce un objetivo hostil.
help.Ships/SamKeepLoaded = Un lanzador cargado (caliente) mantiene los misiles en sus rieles tras un lanzamiento: el juego los descarga al pañol cuando el lanzador lleva un rato inactivo (un segundo misil «desaparece» tras el primer disparo). Desactivado = como en el juego.
help.Ships/SamAnimFix = Los misiles se mueven al cargar y descargar (suben desde / bajan bajo la cubierta) aunque el archivo de munición no tenga datos de posición bajo el nombre exacto del sistema del lanzador (p. ej. SA-N-1A con munición SA-N-1): se usa la entrada coincidente más cercana.
help.Ships/SamAutoChargeRange = Distancia (mn) de una aeronave desconocida que se acerca y hace cargar los lanzadores SAM.
help.Ships/NoRbuSurfaceChase = Un barco que ataca un objetivo de superficie con morteros antisubmarinos (RBU) no lo persigue para entrar en el alcance de los morteros - mantiene el rumbo y dispara cuando el objetivo entra en alcance. Todos los barcos, también los enemigos.
help.Ships/NoAirChase = Un barco no persigue aviones y misiles para llevarlos al alcance de sus armas - mantiene el rumbo y dispara cuando entran en alcance. Todos los barcos, también los enemigos.
help.UI/WeaponsTabGroundUnits = La pestaña de armamento para vehículos terrestres e instalaciones en tierra (las unidades con cañones / lanzadores propios).
help.UI/WeaponsTabAircraft = La pestaña de armamento para aviones y helicópteros (sus armas en los puntos de anclaje: un grupo, un Fuego por tipo de munición, interruptores por tipo de objetivo).
help.UI/FireShowsZones = Mientras se elige el objetivo tras Fuego, los arcos de tiro y el alcance de las armas se muestran en el mapa y en 3D (como hace el juego con Alt pulsado sobre un arma en la línea de estado de la unidad).
help.Guns/AimBeyondMaxRange = Los cañones, CIWS y ametralladoras del jugador giran y se elevan hacia un objetivo más allá de su alcance máximo (hasta 1,5 x el alcance, al menos 5 mn) o fuera de su sector de tiro (hasta donde lo permita el sector) sin disparar. Desactivado = como en el juego: la torreta se queda quieta hasta que el objetivo esté en alcance y en el sector.
help.Guns/MaxAccuracyMeters = Mejor (máxima) precisión de los cañones contra objetivos de superficie, en metros: el mínimo del error de distancia del control de tiro. El juego usa unos 40 m, así que a corta distancia (hasta ~1,4 mn) los cañones son relativamente menos precisos que a media distancia. La escala con la distancia (1,5 % del alcance) se mantiene. Ponga unos 40 para el comportamiento del juego.
help.General/Debug = Registro detallado y BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Idioma de los textos del mod: un código de idioma del juego (en, ru ...); vacío = el idioma propio del juego. Los textos están en los archivos lang/<código>.ini de la carpeta del mod - edítelos para traducir.
help.Fire/UnknownAirMinKnots = Velocidad (kn) a partir de la cual una aeronave no identificada que se acerca al barco (a menos de 50 nm) es atacada por el interruptor «On Free» de la pestaña Weapons. Los aviones comerciales del juego crucero a unos 460-480 kn, máximo 560.
help.Fire/UnknownAirMaxNm = Distancia (nm) dentro de la cual una aeronave rápida no identificada que se acerca al barco es atacada por el interruptor «On Free» de la pestaña Weapons.
help.Fire/UnknownAirDefaultOwn = Estado inicial del interruptor «On Free» de la pestaña Weapons para tus barcos y los de tus aliados (lo que ajustes en una unidad se guarda con ella).
help.Fire/UnknownAirDefaultEnemy = Lo mismo para los barcos IA enemigos (su IA ataca esas aeronaves por sí sola).
help.Fire/EngageByPlotRelation = La IA del juego toma un contacto como objetivo solo si es hostil en el plot Y su bando real también es hostil. El bando real es algo que el jugador no puede saber, así que un contacto que el jugador marcó como hostil (p. ej. un avión de línea neutral) nunca es atacado por los barcos del jugador en Free. Activado: los barcos del jugador se guían solo por el plot: los contactos marcados como hostiles son atacados y el bando real se ignora (sin trampas). Desactivado = como en el juego.
help.Fire/SamTightNezOnly = Con «Restringido», el fuego automático de los misiles antiaéreos de tus barcos espera a que una aeronave esté dentro de la zona sin escape del misil (la distancia dentro de la cual la aeronave no puede escapar de él, como la calcula el juego para el mapa y la descripción), en lugar de disparar al alcance máximo. Las órdenes del jugador y «Libre» no se ven afectadas. Desactivado = como en el juego.
help.Guns/AmmunitionFix = La precisión (error circular probable) y la potencia de la cabeza de guerra de la munición de cañón se toman del paquete del autor (ammunition_fix.txt en la carpeta del mod) y de los valores que fije en la tabla de abajo; en la tabla se puede añadir cualquier munición de cañón del juego o quitar una fila. No = los valores propios de munición del juego. Se aplica a la munición cargada tras Aplicar (inicio de misión).
help.Guns/EngageOutsideSector = Muchas armas grandes (cañones de acorazados y cruceros, algunos CIWS) tienen EngageOnlyInsideArc=True en el juego: nunca se les asigna un objetivo fuera de su sector de tiro. Activado = se ignora esta restricción; el arma toma ese objetivo y gira hasta el borde más cercano de su sector (y no dispara hasta que el objetivo esté dentro). Se aplica a las unidades cargadas tras el cambio (inicio de misión). Funciona junto con la opción anterior.
help.Guns/RememberTargets = Una nueva orden de fuego hace que los cañones cambien al nuevo objetivo como antes, pero los objetivos anteriores no se olvidan: un cañón que no alcanza el nuevo objetivo (fuera de alcance o de su sector de tiro) sigue con el objetivo anterior más reciente que sí alcanza, y vuelve al más reciente cuando puede. Alto el fuego borra la lista. Desactivado = como en el juego: cada orden nueva sustituye a la anterior.
help.UI/BottomPanelFire = Un clic en un arma del panel inferior de la pantalla funciona como el botón Fire de la pestaña Armas: los sectores de tiro y el alcance de las armas se muestran en rojo en el mapa y en 3D y se oculta el círculo rojo de alcance del juego. Requiere «Fire shows weapon arcs and range».
help.UI/SectionTargetTypes = El título de un grupo SAM de la pestaña Armas también enumera los demás tipos de objetivo de los misiles antiaéreos: SAM/ANTI-SHIP (un SAM que también puede atacar buques). Los demás tipos de objetivo de los misiles que no son SAM (ANTI-SHIP/ASW: un misil que ataca buques y submarinos) se enumeran siempre.
