ammo.none = No hay más munición de cañón.
ammo.removeTip = Quitar de la tabla (vuelven a valer los valores del juego)
help.Guns/RerollAimError = El juego añade al punto de puntería de cada cañón un error aleatorio de control de tiro y lo mantiene hasta que el cañón dispara. Cerca del alcance máximo ese error puede sacar el punto de la tabla de tiro: el cañón se queda sin solución, ni siquiera gira y nunca dispara, porque el error solo se vuelve a sortear tras un disparo - una torre queda inactiva minutos mientras sus vecinas disparan. Sí = ese cañón recibe un error nuevo al instante (solo si el blanco en sí puede alcanzarse). No = como en el juego. Solo cañones del jugador.
help.Guns/BarrelScatter = El juego sortea la dispersión de los proyectiles una vez por salva y se la da a todos los cañones de la montura, así que los proyectiles de una torre doble o triple vuelan exactamente en paralelo, caen en línea y aciertan o fallan juntos. Sí = cada cañón después del primero sortea su propia dispersión (la misma del juego, alrededor del mismo punto de puntería). No = como en el juego. Objetivos de superficie, cañones navales de todos los barcos.
help.Guns/PointFire = El juego dispara los cañones solo contra objetos: un clic en el mapa vacío dice «se requiere objetivo». Activado = un clic derecho en el mapa coloca allí un señuelo invisible y los cañones lo atacan como a un objetivo normal (se elimina cuando ningún cañón tiene orden sobre él). Desactivado = como en el juego. Cañones navales del jugador.
help.Guns/BigGunsLocalSolution = Un cañón con el director destruido o apagado se queda para siempre con solución de tiro 0 en el juego (solo sigue al mejor sensor operativo), así que dispara con todo el error del control local. Las torres grandes tienen control local y telémetros propios. Sí = un cañón naval con proyectil de más de 2 kg (unos 50 mm o más) y sin director operativo calcula la solución él mismo, como un cañón sin sensores (su ganancia de puntería sigue siendo la del control local: peor que con director). Los cañones menores quedan como en el juego. No = como en el juego.
help.Guns/ClickEngagesAllGuns = Un clic derecho en un contacto hostil con un buque propio seleccionado hace que el juego ordene UNA munición de cañón: la de mayor alcance que tenga en ese momento un cañón utilizable (un cañón con el director destruido o recargando no cuenta, y su calibre se salta). Sí = cada munición de cañón del buque que alcance el blanco (solo alcance, el sector de fuego no importa) recibe la orden. No = como en el juego. Solo buques del jugador.
help.Guns/LocalControlKeepsFiring = Un cañón sin director operativo (destruido, apagado o inexistente) apunta con control local. El juego retiene entonces cada disparo siguiente hasta que cae el proyectil anterior (tiro de corrección: un proyectil por tiempo de vuelo, 30-60 s a gran distancia) mientras la solución del cañón sea inferior al 95 %; con el director destruido la solución se queda en 0, así que ese cañón dispara muy rara vez. Sí = sin esa espera: un cañón con control local dispara a su cadencia normal (su precisión sigue siendo mala, como en el juego). No = como en el juego. Solo cañones del jugador.
help.Guns/AccuracyMultiplier = Cuán precisos son los proyectiles en sí: la dispersión de los proyectiles alrededor del punto de puntería se divide por este número, así que 2 = la mitad de dispersión (el doble de preciso), 0,5 = el doble de dispersión, 1 = como en el juego. Los valores del paquete del autor y los suyos en la tabla de munición de abajo sustituyen el resultado tal cual. Surte efecto desde el próximo inicio de misión.
help.Guns/FireControlAccuracy = Con qué precisión apuntan los cañones a blancos de superficie, todos los cañones: el error de puntería de cada salva se divide por este número (2 = mitad de error, 1 = como en el juego). Se suma a todo lo que el juego ya cuenta (director, luz, dotación, cuán fijado está el blanco). La dispersión de los proyectiles en sí es otra cosa: véase la precisión de los proyectiles arriba. Surte efecto de inmediato.
help.Guns/WeakDirectorsLift = Qué parte de la brecha entre un director muy débil y el director más débil del juego se cierra, en porcentaje. El director más débil del juego tiene una precisión de 0,75 (el juego la llama gain); algunos conjuntos de reglas (p. ej. paquetes WW2) tienen directores de 0,1-0,6, y hasta uno bueno de ellos apunta mucho peor que los del juego. Un director por debajo de 0,75 ve subir su precisión esa parte de la diferencia hasta 0,75 (50 = a medio camino: 0,35 pasa a 0,55); su solución mínima crece en el mismo factor. Un mejor director tiene errores de puntería menores, construye la solución de tiro (la Solución % del cañón) más rápido y hace que los cañones esperen menos las salpicaduras. Los directores de 0,75 o más no se tocan. 0 = como son los directores, 100 = todos los directores débiles tan buenos como el más débil del juego. Surte efecto de inmediato.
help.Guns/LocalControlGain = Precisión de los cañones sin director operativo (la dotación apunta por sí misma; el juego la llama gain): cuanto mayor, menores los errores de puntería. El valor propio del juego es 0,6, mejor que la mayoría de los directores de conjuntos de reglas con directores débiles; esto es un multiplicador sobre él. 1 = el valor del juego. Surte efecto de inmediato.
help.Guns/SolutionBuildSpeed = Con qué rapidez construyen los cañones su solución de tiro (la Solución % del cañón: cuán bien ha fijado el cañón rumbo y velocidad del blanco; una solución mayor significa menores errores por el movimiento del blanco y menos esperas de salpicaduras). Es un multiplicador solo de la velocidad - la precisión del director no cambia. Se aplica a directores y a cañones sin director. 1 = como en el juego; 0,3 = tres veces más lento. Un giro o cambio de velocidad del blanco sigue costando la misma parte de la solución, así que con velocidad baja un blanco que maniobra mantiene la solución baja. Surte efecto de inmediato.
help.Guns/ManeuverSolutionLoss = Cuánta solución de tiro pierde un cañón en cada comprobación (cada 2 s) cuando el rumbo del blanco cambió más de 4 grados y/o su velocidad más de 4 nudos: este porcentaje de la solución ACTUAL, una vez por el rumbo y otra por la velocidad. El juego quita 0,1 fijo (10 puntos) cada vez, sea la solución alta o baja, así que un cañón con solución baja no puede aumentarla contra un blanco que maniobra. 0 = los 0,1 fijos del juego. Vale para directores y para cañones sin director.
help.Guns/LocalSolutionGrowth = Qué tan rápido un cañón grande sin director operativo (véase Los cañones grandes calculan solución sin director) construye su propia solución de tiro, como porcentaje de la velocidad de crecimiento de su MEJOR director (el más fuerte de sus sensores asociados, operativo o no: ganancia x tripulación x luz). El cañón sin ningún sensor del juego la construye solo a la velocidad de la tripulación, que es más rápida que un director débil (ganancia 0,3-0,5) y convierte la pérdida del director en ventaja. 75 = tres cuartos de la velocidad del director. Un cañón sin ningún sensor asociado usa el director PROMEDIO de todas las unidades de la misión (el mismo porcentaje), así que tampoco es más rápido que un director.
help.Guns/OpticalDirectorMinSolution = Solución de tiro mínima con director óptico: la solución (cuán bien ha fijado el cañón rumbo y velocidad del blanco, mostrada como Solución % del cañón, 0..1) nunca cae por debajo de este nivel y parte de él, de modo que los cañones aciertan antes tras abrir fuego y esperan menos las salpicaduras. Es un multiplicador del mínimo propio del director (la clave ini del sensor FCMinSolution); 1 = como es el director.
help.Guns/RadarDirectorMinSolution = Solución de tiro mínima con director de radar: la solución (cuán bien ha fijado el cañón rumbo y velocidad del blanco, mostrada como Solución % del cañón, 0..1) nunca cae por debajo de este nivel y parte de él, de modo que los cañones aciertan antes tras abrir fuego y esperan menos las salpicaduras. Es un multiplicador del mínimo propio del director (la clave ini del sensor FCMinSolution); 1 = como es el director.
