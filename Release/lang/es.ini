ammo.note = Precisión: error circular probable, el radio en metros a máximo alcance dentro del cual caen los proyectiles (menor = más preciso). Potencia: potencia de la cabeza de guerra. Los valores del juego aparecen junto a los campos; la flecha los restaura. ✕ quita una fila de la tabla y la lista bajo la tabla añade cualquier otra munición de cañón del juego. Se aplica a la munición cargada tras Aplicar (inicio de misión).
