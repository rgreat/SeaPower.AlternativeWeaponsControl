legend.dom = KHÔNG · TL · MẶT · NGẦM · BỜ - AI có được tự dùng bệ phóng chống máy bay, tên lửa và ngư lôi, tàu mặt nước, tàu ngầm, mục tiêu trên bờ:
legend.auto = tự động
legend.forced = tự động, bị lệnh thường trực của đơn vị ép buộc (Always: có hiệu lực ở mọi trạng thái vũ khí)
