ammo.note = Độ chính xác: sai số tròn xác suất, bán kính tính bằng mét ở tầm bắn tối đa trong đó đạn rơi (nhỏ hơn = chính xác hơn). Uy lực: uy lực đầu đạn. Giá trị của trò chơi hiện bên cạnh các ô; mũi tên khôi phục chúng. ✕ xóa một hàng khỏi bảng, danh sách dưới bảng thêm bất kỳ đạn pháo nào khác của trò chơi. Áp dụng cho đạn được nạp sau khi Áp dụng (lúc bắt đầu nhiệm vụ).
