legend.local = Ở tên vũ khí khi đang bắn: giám đốc hỏa lực đang ngắm (xanh dương) hoặc «Điều khiển cục bộ» (cam) - không có giám đốc hoạt động, kém chính xác.
legend.fire = Bắn: chọn mục tiêu trên bản đồ (ở hàng của bệ phóng - bệ phóng đó bắn); ▾ tùy chọn loạt bắn và phóng; ■ ngừng bắn; ↻ nạp lại.
legend.channels = M 2/6 · D 5/12: kênh điều khiển hỏa lực của các giám đốc hỏa lực trong nhóm - mục tiêu theo dõi / vũ khí dẫn đường đang bay cùng lúc; màu hổ phách khi không còn kênh trống. Rê chuột vào: các giám đốc hỏa lực kèm tra cứu.
