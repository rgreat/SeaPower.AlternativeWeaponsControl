help.UI/ClickVolume = Âm lượng tiếng nhấp của các nút và công tắc trên thẻ, 0..1 (0 = không âm thanh; các nút của trò chơi không có tiếng).
help.FireControl/GunOneDirector = Một khẩu pháo khai hỏa chiếm kênh mục tiêu trên MỘT giám đốc hỏa lực của nó (cái đang theo dõi mục tiêu của nó, hoặc cái trống tốt nhất), không phải tất cả như trong trò chơi - nên các giám đốc hỏa lực khác vẫn trống cho các pháo khác và cho tên lửa dùng chung chúng (ví dụ Mk92 + STIR trên Adelaide, Top Bow + Four Eyes trên Sverdlov).
help.FireControl/GunChannelLimit = Khẩu pháo mà các giám đốc hỏa lực không còn kênh mục tiêu trống sẽ ngắm bằng điều khiển cục bộ (hình phạt của trò chơi khi không giám đốc nào hoạt động: hệ số giải pháp thấp hơn, sai số lớn hơn trong bóng tối) cho đến khi có kênh trống. Tắt = như trong trò chơi: pháo ngắm bằng giám đốc hỏa lực tốt nhất đang hoạt động dù nó đã theo dõi bao nhiêu mục tiêu.
help.UI/SamReadyButton = Nút sẵn sàng trên các hàng bệ phóng cần khởi động trước khi bắn (SAM): nhấp = nạp tên lửa ngay, nhấp lần nữa = cất đi.
help.UI/SamReadyMinutes = Số phút bệ phóng giữ trạng thái sẵn sàng sau khi bấm nút nếu không được dùng: sau đó tên lửa được cất.
help.Ships/SamAutoCharge = Các đơn vị (cả của địch) nạp bệ phóng SAM (tên lửa lên ray) khi máy bay không rõ tiến gần hơn khoảng cách bên dưới. Chỉ tính các tiếp xúc mà thủy thủ đoàn đã xử lý (vòng OODA của trò chơi). Tắt = cách khởi động riêng của trò chơi, bắt đầu khi biết mục tiêu địch.
help.Ships/SamKeepLoaded = Bệ phóng đã nạp (nóng) giữ tên lửa trên ray sau khi phóng: trò chơi dỡ chúng vào kho khi bệ phóng nhàn rỗi một lúc (tên lửa thứ hai «biến mất» sau phát bắn đầu). Tắt = như trong trò chơi.
help.Ships/SamAnimFix = Tên lửa chuyển động khi nạp và cất (nhô lên từ / hạ xuống dưới boong) ngay cả khi tệp đạn dược không có dữ liệu vị trí dưới đúng tên hệ thống của bệ phóng (ví dụ SA-N-1A với đạn SA-N-1): dùng mục khớp gần nhất.
help.Ships/SamAutoChargeRange = Khoảng cách (hl) của máy bay không rõ đang tiến gần khiến bệ phóng SAM được nạp.
help.Ships/NoRbuSurfaceChase = Tàu tấn công mục tiêu mặt nước bằng cối chống ngầm (RBU) không đuổi theo để vào tầm cối - nó giữ hướng đi và bắn khi mục tiêu vào tầm. Mọi tàu, cả của địch.
help.Ships/NoAirChase = Tàu không đuổi theo máy bay và tên lửa để đưa chúng vào tầm vũ khí - nó giữ hướng đi và bắn khi chúng vào tầm. Mọi tàu, cả của địch.
help.UI/WeaponsTabGroundUnits = Thẻ vũ khí cho xe mặt đất và công trình trên bờ (các đơn vị có pháo / bệ phóng riêng).
help.UI/WeaponsTabAircraft = Thẻ vũ khí cho máy bay và trực thăng (vũ khí trên các điểm treo: một nhóm, một nút Bắn cho mỗi loại đạn, công tắc theo loại mục tiêu).
help.UI/FireShowsZones = Trong lúc chọn mục tiêu sau khi Bắn, cung bắn và tầm bắn của vũ khí được hiển thị trên bản đồ và trong 3D (như trò chơi làm khi giữ Alt trên vũ khí ở dòng trạng thái của đơn vị).
help.Guns/AimBeyondMaxRange = Pháo, CIWS và súng máy của người chơi xoay và nâng về phía mục tiêu ngoài tầm bắn tối đa (đến 1,5 lần tầm, tối thiểu 5 hải lý) hoặc ngoài cung bắn (trong giới hạn cung cho phép) mà không bắn. Tắt = như trong game: tháp pháo đứng yên cho đến khi mục tiêu nằm trong tầm và trong cung bắn.
help.Guns/MaxAccuracyMeters = Độ chính xác tốt nhất (tối đa) của pháo với mục tiêu mặt nước, tính bằng mét: ngưỡng sàn của sai số cự ly điều khiển hỏa lực. Trò chơi dùng khoảng 40 m, nên ở cự ly gần (đến ~1,4 hl) pháo tương đối kém chính xác hơn ở cự ly trung bình. Việc co giãn theo cự ly (1,5 % tầm) được giữ. Đặt khoảng 40 để có hành vi của trò chơi.
help.General/Debug = Ghi nhật ký chi tiết và BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Ngôn ngữ của văn bản mod: mã của một ngôn ngữ trò chơi (en, ru ...); trống = ngôn ngữ riêng của trò chơi. Văn bản nằm trong các tệp lang/<mã>.ini trong thư mục mod - chỉnh sửa để dịch.
help.Fire/UnknownAirMinKnots = Tốc độ (kn); máy bay chưa nhận dạng nhanh hơn mức này và đang bay về phía tàu (trong 50 nm) sẽ bị công tắc "On Free" của tab Weapons tấn công. Máy bay chở khách trong game bay hành trình khoảng 460-480 kn, tối đa 560.
help.Fire/UnknownAirMaxNm = Khoảng cách (nm) trong đó máy bay lạ nhanh đang bay về phía tàu bị công tắc "On Free" của tab Weapons tấn công.
help.Fire/UnknownAirDefaultOwn = Trạng thái ban đầu của công tắc "On Free" tab Weapons cho tàu của bạn và đồng minh (giá trị đặt trên một đơn vị được lưu cùng nó).
help.Fire/UnknownAirDefaultEnemy = Tương tự cho tàu AI của địch (AI của họ tự tấn công các máy bay này).
help.Fire/EngageByPlotRelation = AI của trò chơi chỉ coi một mục tiêu là đích nếu nó thù địch trên plot VÀ phe thật của nó cũng thù địch. Phe thật là điều người chơi không thể biết, nên mục tiêu do người chơi đánh dấu thù địch (ví dụ máy bay dân dụng trung lập) không bao giờ bị tàu của người chơi ở chế độ Free tấn công. Bật: tàu của người chơi chỉ dựa vào plot - mục tiêu được đánh dấu thù địch bị tấn công, phe thật bị bỏ qua (không gian lận). Tắt = như trong trò chơi.
help.Fire/SamTightNezOnly = Khi «Hạn chế», hỏa lực tự động của tên lửa đất đối không trên tàu của bạn đợi đến khi máy bay vào vùng không thể thoát của tên lửa (khoảng cách mà máy bay không thể thoát khỏi nó, như trò chơi tính cho bản đồ và chú giải), thay vì bắn ở tầm tối đa. Lệnh của người chơi và «Tự do» không bị ảnh hưởng. Tắt = như trong trò chơi.
help.Guns/AmmunitionFix = Độ chính xác (sai số tròn xác suất) và uy lực đầu đạn của đạn pháo lấy từ gói của tác giả (ammunition_fix.txt trong thư mục mod) và từ các giá trị bạn đặt trong bảng bên dưới; trong bảng có thể thêm bất kỳ đạn pháo nào của trò chơi hoặc xóa một hàng. Tắt = giá trị đạn riêng của trò chơi. Có hiệu lực với đạn được nạp sau khi Áp dụng (lúc bắt đầu nhiệm vụ).
help.Guns/EngageOutsideSector = Nhiều vũ khí lớn (pháo thiết giáp hạm, tuần dương, một số CIWS) có EngageOnlyInsideArc=True trong game: không bao giờ được giao mục tiêu ngoài cung bắn. Bật = bỏ qua hạn chế này; vũ khí nhận mục tiêu đó và xoay về mép gần nhất của cung (không bắn cho đến khi mục tiêu ở trong). Áp dụng cho đơn vị tải sau khi đổi (bắt đầu nhiệm vụ). Hoạt động cùng tùy chọn ở trên.
help.Guns/RememberTargets = Lệnh khai hỏa mới vẫn khiến pháo chuyển sang mục tiêu mới như trước, nhưng các mục tiêu trước đó không bị quên: pháo không với tới mục tiêu mới (ngoài tầm bắn hoặc ngoài khu vực bắn) sẽ tiếp tục bắn mục tiêu trước đó mới nhất mà nó với tới được, và quay lại mục tiêu mới nhất khi có thể. Ngừng bắn sẽ xóa danh sách. Tắt = như trong game: mỗi lệnh mới thay thế lệnh cũ.
help.UI/BottomPanelFire = Nhấp vào vũ khí trên bảng ở cuối màn hình hoạt động như nút Fire của tab Vũ khí: vùng bắn và tầm bắn của vũ khí được hiển thị màu đỏ trên bản đồ và trong 3D, vòng tròn tầm bắn đỏ của game bị ẩn. Cần bật “Fire shows weapon arcs and range”.
help.UI/SectionTargetTypes = Tiêu đề nhóm SAM trong tab Vũ khí cũng liệt kê các loại mục tiêu khác của tên lửa phòng không (SAM/ANTI-SHIP: SAM cũng đánh được tàu). Các loại mục tiêu khác của tên lửa không phải SAM (ANTI-SHIP/ASW: tên lửa đánh tàu và tàu ngầm) luôn được liệt kê.
gt.radar = Ngắm bằng giám đốc radar: {0}
gt.optical = Ngắm bằng giám đốc quang học: {0}
gt.trimmed = Ngắm bằng thiết bị điều khiển {0}: radar tắt (Strict EMCON), chế độ quang học
gt.dir = Giám đốc: hệ số lời giải {0}, lời giải tối thiểu {1}%
gt.tracks = , theo dõi cột nước đạn rơi
gt.local = Điều khiển cục bộ (pháo không có giám đốc)
gt.localNoDir = Điều khiển cục bộ (không có giám đốc hoạt động)
gt.localGain = Hệ số lời giải khi điều khiển cục bộ {0}
gt.solution = Lời giải bắn {0}%
gt.waits = chờ đạn rơi của loạt bắn trước
gt.errAt = Sai số ngắm (1 sigma) ở {0} km:
gt.errRef = Sai số ngắm ở {0} km, mục tiêu đứng yên:
gt.err = cự ly {0} m, hướng {1} m
gt.errPred = , chuyển động mục tiêu {0} m
gt.errStab = , chuyển động tàu ta {0} m
gt.scatter = Độ tản đạn ở cự ly này: dọc {0} m, ngang {1} m
gt.note = Giám đốc tốt hơn và lời giải cao hơn cho sai số nhỏ hơn; bóng tối làm xấu đi việc ngắm quang học. Đã tính các hệ số của mod.
grp.global = Chung
grp.directors = Giám đốc
lbl.Guns/RerollAimError = Gỡ kẹt pháo ở cự ly xa
lbl.Guns/BarrelScatter = Độ tán riêng cho từng nòng của tháp pháo
lbl.Guns/PointFire = Bắn vào một điểm trên bản đồ
lbl.Guns/BigGunsLocalSolution = Pháo cỡ lớn tự lập lời giải khi không có giám đốc
lbl.Guns/ClickEngagesAllGuns = Nhấp vào mục tiêu: tất cả pháo
lbl.Guns/LocalControlKeepsFiring = Điều khiển cục bộ: không chờ đạn rơi
lbl.Guns/AccuracyMultiplier = Độ chính xác đạn pháo
lbl.Guns/FireControlAccuracy = Độ chính xác ngắm
lbl.Guns/WeakDirectorsLift = Tăng cường giám đốc yếu
lbl.Guns/StrictEmconOpticalShare = Radar điều khiển pháo khi Strict EMCON: tỷ lệ độ chính xác radar
lbl.Guns/LocalControlGain = Chất lượng lời giải khi không có giám đốc
lbl.Guns/OpticalDirectorMinSolution = Chất lượng lời giải với giám đốc quang học
lbl.Guns/SolutionBuildSpeed = Tốc độ lập lời giải bắn
lbl.Guns/ManeuverSolutionLoss = Lời giải bị mất khi mục tiêu cơ động
lbl.Guns/LocalSolutionGrowth = Tốc độ lập lời giải khi không có giám đốc
lbl.Guns/RadarDirectorMinSolution = Chất lượng lời giải với giám đốc radar
preset.title = Cấu hình giám đốc
preset.base = Cơ bản
preset.advanced = Nâng cao
preset.ww2 = WW2 Mod
preset.custom = giá trị tùy chỉnh
preset.note = Điền các thiết lập giám đốc bên dưới (không gồm độ chính xác đạn pháo). Cơ bản: trò chơi nguyên bản. Nâng cao: giám đốc yếu chính xác hơn, pháo không có giám đốc kém hơn một chút - hợp với trò chơi và các bộ luật có giám đốc yếu. WW2 Mod: cho gói WW2 (giám đốc yếu): giám đốc yếu được nâng lên một phần mười đường tới giám đốc yếu nhất của trò chơi, pháo không có giám đốc kém hơn giám đốc, lời giải bắn được lập với nửa tốc độ. Nhấn Áp dụng để lưu.
ammo.add = Thêm đạn:
ammo.more = ...và {0} nữa: gõ để thu hẹp danh sách
ammo.none = Không còn đạn pháo nào khác.
ammo.removeTip = Xóa khỏi bảng (giá trị của trò chơi áp dụng lại)
help.Guns/RerollAimError = Trò chơi cộng vào điểm ngắm của mỗi khẩu pháo một sai số điều khiển hỏa lực ngẫu nhiên và giữ nó cho đến khi pháo bắn. Gần tầm bắn tối đa, sai số này có thể đẩy điểm ngắm ra ngoài bảng bắn: khi đó pháo không có lời giải, thậm chí không quay và không bao giờ bắn, vì sai số chỉ được rút lại sau một phát bắn - một tháp pháo đứng yên hàng phút trong khi các pháo bên cạnh bắn. Bật = khẩu pháo như vậy rút sai số mới ngay (chỉ khi bản thân mục tiêu có thể bị bắn trúng). Tắt = như trong trò chơi. Chỉ pháo của người chơi.
help.Guns/BarrelScatter = Trò chơi chỉ rút độ tán của đạn một lần cho mỗi loạt bắn rồi giao cho mọi nòng của bệ pháo, nên đạn của tháp pháo đôi hoặc ba bay song song hoàn toàn, rơi thành một hàng, trúng hoặc trượt cùng nhau. Bật = mỗi nòng sau nòng đầu tiên tự rút độ tán riêng (cùng độ tán như trò chơi, quanh cùng điểm ngắm). Tắt = như trò chơi. Mục tiêu mặt nước, pháo hải quân của mọi tàu.
help.Guns/PointFire = Trò chơi chỉ cho pháo bắn vào vật thể: nhấp vào bản đồ trống sẽ báo «cần mục tiêu». Bật = nhấp chuột phải lên bản đồ sẽ đặt một mục tiêu mồi vô hình tại điểm đó và pháo tấn công nó như mục tiêu thường (xóa khi không còn pháo nào có lệnh với nó). Tắt = như trong game. Pháo hải quân của người chơi.
help.Guns/BigGunsLocalSolution = Pháo có giám đốc bị phá hủy hoặc tắt luôn giữ lời giải bắn bằng 0 trong trò chơi (chỉ theo cảm biến tốt nhất còn hoạt động), nên bắn với toàn bộ sai số điều khiển cục bộ. Tháp pháo lớn có điều khiển cục bộ và máy đo xa riêng. Bật = pháo hải quân có đạn nặng hơn 2 kg (khoảng 50 mm trở lên) và không có giám đốc hoạt động tự lập lời giải bắn, như pháo không có cảm biến (độ lợi ngắm vẫn là của điều khiển cục bộ: kém hơn giám đốc). Pháo nhỏ giữ như trong trò chơi. Tắt = như trò chơi.
help.Guns/ClickEngagesAllGuns = Nhấp chuột phải vào mục tiêu địch khi đang chọn tàu của mình khiến trò chơi ra lệnh cho MỘT loại đạn pháo - loại có tầm xa nhất mà lúc đó có pháo dùng được (pháo bị hỏng giám đốc hoặc đang nạp đạn không được tính, nên cỡ nòng đó bị bỏ qua). Bật = mọi loại đạn pháo của tàu với tới mục tiêu (chỉ xét tầm, không xét cung bắn) đều nhận lệnh. Tắt = như trong trò chơi. Chỉ tàu của người chơi.
help.Guns/LocalControlKeepsFiring = Pháo không có giám đốc hoạt động (bị phá hủy, bị tắt hoặc không có) ngắm bằng điều khiển cục bộ. Khi lời giải của pháo dưới 95 %, trò chơi giữ mỗi phát bắn tiếp theo cho đến khi quả đạn trước rơi (bắn hiệu chỉnh: một quả mỗi thời gian bay, 30-60 giây ở cự ly xa); khi giám đốc bị phá hủy, lời giải ở mức 0 nên khẩu pháo đó rất hiếm khi bắn. Bật = không chờ như vậy: pháo điều khiển cục bộ bắn với tốc độ bình thường (độ chính xác vẫn kém như trong trò chơi). Tắt = như trong trò chơi. Chỉ pháo của người chơi.
help.Guns/AccuracyMultiplier = Bản thân đạn pháo chính xác đến đâu: độ tản của đạn quanh điểm ngắm được chia cho số này, nên 2 = tản một nửa (chính xác gấp đôi), 0,5 = tản gấp đôi, 1 = như trong trò chơi. Giá trị của gói tác giả và giá trị riêng của bạn trong bảng đạn bên dưới thay thế kết quả nguyên trạng. Có hiệu lực từ lần bắt đầu nhiệm vụ tiếp theo.
help.Guns/FireControlAccuracy = Pháo ngắm chính xác đến đâu vào mục tiêu mặt nước, mọi pháo: sai số ngắm của mỗi loạt bắn được chia cho số này (2 = sai số một nửa, 1 = như trong trò chơi). Nó cộng thêm vào mọi thứ trò chơi đã tính (giám đốc, ánh sáng, kíp pháo, mức độ khóa mục tiêu). Độ tản của chính đạn pháo là chuyện khác: xem độ chính xác đạn pháo ở trên. Có hiệu lực ngay.
help.Guns/WeakDirectorsLift = Bao nhiêu phần khoảng cách giữa một giám đốc rất yếu và giám đốc yếu nhất của trò chơi được thu hẹp, tính bằng phần trăm. Giám đốc yếu nhất của trò chơi có độ chính xác 0,75 (trò chơi gọi là gain); một số bộ luật (ví dụ gói WW2) có giám đốc 0,1-0,6, và ngay cả giám đốc tốt trong số đó cũng ngắm kém hơn nhiều so với của trò chơi. Giám đốc dưới 0,75 được nâng độ chính xác theo tỷ lệ này của chênh lệch tới 0,75 (50 = nửa đường: 0,35 thành 0,55); lời giải tối thiểu của nó tăng cùng hệ số. Giám đốc tốt hơn có sai số ngắm nhỏ hơn, lập lời giải bắn (Lời giải % của pháo) nhanh hơn và khiến pháo ít phải chờ đạn rơi hơn. Giám đốc từ 0,75 trở lên không bị đụng tới. 0 = giữ nguyên, 100 = mọi giám đốc yếu tốt bằng giám đốc yếu nhất của trò chơi. Có hiệu lực ngay.
help.Guns/LocalControlGain = Độ chính xác của pháo không có giám đốc hoạt động (kíp pháo tự ngắm; trò chơi gọi là gain): càng cao, sai số ngắm càng nhỏ. Giá trị riêng của trò chơi là 0,6, tốt hơn hầu hết giám đốc của các bộ luật có giám đốc yếu; đây là hệ số nhân của nó. 1 = giá trị của trò chơi. Có hiệu lực ngay.
help.Guns/SolutionBuildSpeed = Pháo lập lời giải bắn nhanh đến đâu (Lời giải % của pháo: pháo bám hướng đi và tốc độ mục tiêu tốt thế nào; lời giải cao hơn nghĩa là sai số ngắm do mục tiêu chuyển động nhỏ hơn và ít phải chờ đạn rơi hơn). Đây chỉ là hệ số của tốc độ - độ chính xác của giám đốc không đổi. Áp dụng cho giám đốc và cho pháo không có giám đốc. 1 = như trong trò chơi; 0,3 = chậm gấp ba. Mục tiêu đổi hướng hoặc đổi tốc độ vẫn làm mất cùng một phần lời giải, nên với tốc độ thấp, mục tiêu cơ động giữ lời giải ở mức thấp. Có hiệu lực ngay.
help.Guns/ManeuverSolutionLoss = Khẩu pháo mất bao nhiêu lời giải bắn ở mỗi lần kiểm tra (mỗi 2 giây) khi hướng đi của mục tiêu đổi hơn 4 độ và/hoặc tốc độ đổi hơn 4 hải lý/giờ: tỷ lệ phần trăm này của lời giải HIỆN TẠI, một lần cho hướng và một lần cho tốc độ. Trò chơi trừ cố định 0,1 (10 điểm) mỗi lần, dù lời giải cao hay thấp, nên pháo có lời giải thấp không thể tăng lời giải trước mục tiêu cơ động. 0 = 0,1 cố định của trò chơi. Áp dụng cho giám đốc và pháo không có giám đốc.
help.Guns/LocalSolutionGrowth = Tốc độ pháo cỡ lớn không có giám đốc hoạt động (xem Pháo cỡ lớn tự lập lời giải khi không có giám đốc) tự lập lời giải bắn, tính theo phần trăm tốc độ tăng của giám đốc TỐT NHẤT của nó (cảm biến liên kết mạnh nhất, còn hoạt động hay không: độ lợi x kíp x ánh sáng). Pháo không có cảm biến nào trong trò chơi chỉ lập lời giải bằng tốc độ kíp, nhanh hơn giám đốc yếu (độ lợi 0,3-0,5) nên mất giám đốc lại thành lợi thế. 75 = ba phần tư tốc độ của giám đốc. Pháo hoàn toàn không có cảm biến liên kết dùng giám đốc TRUNG BÌNH của mọi đơn vị trong nhiệm vụ (cùng tỷ lệ phần trăm), nên cũng không nhanh hơn giám đốc.
help.Guns/OpticalDirectorMinSolution = Lời giải bắn tối thiểu với giám đốc quang học: lời giải (pháo bám hướng đi và tốc độ mục tiêu tốt thế nào, hiện là Lời giải % của pháo, 0..1) không bao giờ xuống dưới mức này và bắt đầu từ mức này, nên pháo trúng sớm hơn sau khi khai hỏa và ít chờ đạn rơi hơn. Đây là hệ số của mức tối thiểu riêng của giám đốc (khóa ini cảm biến FCMinSolution); 1 = như giám đốc vốn có.
help.Guns/RadarDirectorMinSolution = Lời giải bắn tối thiểu với giám đốc radar: lời giải (pháo bám hướng đi và tốc độ mục tiêu tốt thế nào, hiện là Lời giải % của pháo, 0..1) không bao giờ xuống dưới mức này và bắt đầu từ mức này, nên pháo trúng sớm hơn sau khi khai hỏa và ít chờ đạn rơi hơn. Đây là hệ số của mức tối thiểu riêng của giám đốc (khóa ini cảm biến FCMinSolution); 1 = như giám đốc vốn có.
