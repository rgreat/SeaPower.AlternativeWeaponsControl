help.UI/ClickVolume = Âm lượng tiếng nhấp của các nút và công tắc trên thẻ, 0..1 (0 = không âm thanh; các nút của trò chơi không có tiếng).
help.FireControl/GunOneDirector = Một khẩu pháo khai hỏa chiếm kênh mục tiêu trên MỘT giám đốc hỏa lực của nó (cái đang theo dõi mục tiêu của nó, hoặc cái trống tốt nhất), không phải tất cả như trong trò chơi - nên các giám đốc hỏa lực khác vẫn trống cho các pháo khác và cho tên lửa dùng chung chúng (ví dụ Mk92 + STIR trên Adelaide, Top Bow + Four Eyes trên Sverdlov).
help.FireControl/GunChannelLimit = Khẩu pháo mà các giám đốc hỏa lực không còn kênh mục tiêu trống sẽ ngắm bằng điều khiển cục bộ (hình phạt của trò chơi khi không giám đốc nào hoạt động: hệ số giải pháp thấp hơn, sai số lớn hơn trong bóng tối) cho đến khi có kênh trống. Tắt = như trong trò chơi: pháo ngắm bằng giám đốc hỏa lực tốt nhất đang hoạt động dù nó đã theo dõi bao nhiêu mục tiêu.
help.UI/SamReadyButton = Nút sẵn sàng trên các hàng bệ phóng cần khởi động trước khi bắn (SAM): nhấp = nạp tên lửa ngay, nhấp lần nữa = cất đi.
help.UI/SamReadyMinutes = Số phút bệ phóng giữ trạng thái sẵn sàng sau khi bấm nút nếu không được dùng: sau đó tên lửa được cất.
help.Ships/SamAutoCharge = Các đơn vị (cả của địch) nạp bệ phóng SAM (tên lửa lên ray) khi máy bay không rõ tiến gần hơn khoảng cách bên dưới. Chỉ tính các tiếp xúc mà thủy thủ đoàn đã xử lý (vòng OODA của trò chơi). Tắt = cách khởi động riêng của trò chơi, bắt đầu khi biết mục tiêu địch.
help.Ships/SamKeepLoaded = Bệ phóng đã nạp (nóng) giữ tên lửa trên ray sau khi phóng: trò chơi dỡ chúng vào kho khi bệ phóng nhàn rỗi một lúc (tên lửa thứ hai «biến mất» sau phát bắn đầu). Tắt = như trong trò chơi.
help.Ships/SamAnimFix = Tên lửa chuyển động khi nạp và cất (nhô lên từ / hạ xuống dưới boong) ngay cả khi tệp đạn dược không có dữ liệu vị trí dưới đúng tên hệ thống của bệ phóng (ví dụ SA-N-1A với đạn SA-N-1): dùng mục khớp gần nhất.
help.Ships/SamAutoChargeRange = Khoảng cách (hl) của máy bay không rõ đang tiến gần khiến bệ phóng SAM được nạp.
help.Ships/NoRbuSurfaceChase = Tàu tấn công mục tiêu mặt nước bằng cối chống ngầm (RBU) không đuổi theo để vào tầm cối - nó giữ hướng đi và bắn khi mục tiêu vào tầm. Mọi tàu, cả của địch.
help.Ships/NoAirChase = Tàu không đuổi theo máy bay và tên lửa để đưa chúng vào tầm vũ khí - nó giữ hướng đi và bắn khi chúng vào tầm. Mọi tàu, cả của địch.
help.UI/WeaponsTabGroundUnits = Thẻ vũ khí cho xe mặt đất và công trình trên bờ (các đơn vị có pháo / bệ phóng riêng).
help.UI/WeaponsTabAircraft = Thẻ vũ khí cho máy bay và trực thăng (vũ khí trên các điểm treo: một nhóm, một nút Bắn cho mỗi loại đạn, công tắc theo loại mục tiêu).
help.UI/FireShowsZones = Trong lúc chọn mục tiêu sau khi Bắn, cung bắn và tầm bắn của vũ khí được hiển thị trên bản đồ và trong 3D (như trò chơi làm khi giữ Alt trên vũ khí ở dòng trạng thái của đơn vị).
help.Optics/BinocularsNormalView = Ống nhòm ở mức phóng đại tối đa bắt đầu với chế độ nhìn thường (trò chơi bật bộ lọc ban đêm / nhiệt). Phím lọc của trò chơi bật bộ lọc.
help.Optics/NormalViewDayOnly = Chế độ nhìn thường là mặc định chỉ vào ban ngày; ban đêm giữ bộ lọc mặc định của trò chơi.
help.Effects/FireFlicker = Ánh sáng đám cháy trên tàu nhấp nháy, sâu và nhanh hơn khi đám cháy mạnh hơn (nhỏ / vừa / nặng).
help.Effects/FireLightPower = Độ sáng ánh sáng đám cháy trên tàu (ánh sáng cháy riêng của trò chơi được nhân lên; tầm của nó cũng tăng). 1 = như trò chơi.
help.Effects/MuzzleFlashLight = Một chớp sáng ngắn ở nòng khi pháo, CIWS và súng máy bắn (thấy được ban đêm).
help.Effects/MissileLaunchFlashLight = Một ánh sáng đi theo tên lửa trong lúc bộ đẩy của nó cháy sau khi phóng (thời gian cháy bộ đẩy của tên lửa).
help.Effects/HitFlashLight = Một chớp sáng ngắn nơi đạn pháo trúng (không phải dưới nước).
help.Effects/FlashPower = Độ sáng và kích thước chớp sáng, 1 = mặc định.
help.Guns/AimBeyondMaxRange = Pháo, CIWS và súng máy của người chơi quay và nâng về phía mục tiêu ngoài tầm bắn tối đa (tới 1,5 x tầm, ít nhất 5 hl) mà không bắn, như thể nó ở tầm tối đa. Tắt = như trong trò chơi: tháp pháo đứng yên cho đến khi mục tiêu vào tầm.
help.Guns/MaxAccuracyMeters = Độ chính xác tốt nhất (tối đa) của pháo với mục tiêu mặt nước, tính bằng mét: ngưỡng sàn của sai số cự ly điều khiển hỏa lực. Trò chơi dùng khoảng 40 m, nên ở cự ly gần (đến ~1,4 hl) pháo tương đối kém chính xác hơn ở cự ly trung bình. Việc co giãn theo cự ly (1,5 % tầm) được giữ. Đặt khoảng 40 để có hành vi của trò chơi.
help.Guns/MachineGunBurstFix = Súng máy hiển thị chớp lửa nòng ở mỗi phát bắn: hiệu ứng chớp lửa trong nhóm vẫn đang chạy sẽ được khởi động lại.
help.Guns/MachineGunSoundLoopFix = Tiếng bắn lặp của súng máy bỏ qua phần im lặng của đoạn âm thanh (khoảng trống giữa một loạt bắn dài).
help.Guns/HitSoundFix = Pháo trúng đích luôn phát tiếng nổ: hiệu ứng mà âm thanh chưa bắt đầu (thực thể trong nhóm) được buộc phát.
help.General/Debug = Ghi nhật ký chi tiết và BepInEx/AlternativeWeaponsControl.trace.txt.
help.General/Language = Ngôn ngữ của văn bản mod: mã của một ngôn ngữ trò chơi (en, ru ...); trống = ngôn ngữ riêng của trò chơi. Văn bản nằm trong các tệp lang/<mã>.ini trong thư mục mod - chỉnh sửa để dịch.
help.Fire/UnknownAirMinKnots = Tốc độ (kn); máy bay chưa nhận dạng nhanh hơn mức này và đang bay về phía tàu (trong 50 nm) sẽ bị công tắc "On Free" của tab Weapons tấn công. Máy bay chở khách trong game bay hành trình khoảng 460-480 kn, tối đa 560.
help.Fire/UnknownAirMaxNm = Khoảng cách (nm) trong đó máy bay lạ nhanh đang bay về phía tàu bị công tắc "On Free" của tab Weapons tấn công.
help.Fire/UnknownAirDefaultOwn = Trạng thái ban đầu của công tắc "On Free" tab Weapons cho tàu của bạn và đồng minh (giá trị đặt trên một đơn vị được lưu cùng nó).
help.Fire/UnknownAirDefaultEnemy = Tương tự cho tàu AI của địch (AI của họ tự tấn công các máy bay này).
help.Fire/EngageByPlotRelation = AI của trò chơi chỉ coi một mục tiêu là đích nếu nó thù địch trên plot VÀ phe thật của nó cũng thù địch. Phe thật là điều người chơi không thể biết, nên mục tiêu do người chơi đánh dấu thù địch (ví dụ máy bay dân dụng trung lập) không bao giờ bị tàu của người chơi ở chế độ Free tấn công. Bật: tàu của người chơi chỉ dựa vào plot - mục tiêu được đánh dấu thù địch bị tấn công, phe thật bị bỏ qua (không gian lận). Tắt = như trong trò chơi.
