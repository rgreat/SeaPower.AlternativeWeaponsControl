ammo.note = Độ chính xác: sai số tròn xác suất, bán kính (mét) ở tầm xa tối đa mà đạn rơi vào (nhỏ hơn = chính xác hơn). Uy lực: uy lực đầu đạn. Giá trị của game hiển thị cạnh ô nhập; mũi tên đặt lại. Áp dụng cho đạn dược được nạp sau khi Áp dụng (lúc bắt đầu nhiệm vụ).
